<script type="module">
import { parseHeadings } from "/headings.js";
import { applyOwnEdit, buildHunks, lookAt, readingTime, rebuiltChanges, reviewWithSeen, undoIntoReview } from "/changes.js";
import { createHistory, diff, hashText, record, redo, undo } from "/history.js";
import { countPerHeading, createMark, followEdit, markId, relocate } from "/marks.js";
import { findMatches } from "/search.js";

const SAVE_DELAY_MS = 800;
const JUMP_GAP_PX = 12;
const READ_MODE_KEY = "read-mode";
const END_GAP_PX = 48;
const FLY_MS = 180;
const CONTENT_WAIT_MS = 250;
const SCROLL_DELAY_MS = 200;
const HISTORY_DELAY_MS = 500;
const MIN_HEADINGS_TO_AUTO_OPEN = 5;
const STATE_WAIT_MS = 1000;
const STATE_WRITE_TRIES = 5;
const FONT_WAIT_MS = 1000;
const DRAFT_AUTOSAVE_MS = 10 * 60 * 1000;
const MAX_TRIED_TEXTS = 5;
const SEARCH_DELAY_MS = 100;
// Typing in the note while Find is open refolds the whole note, so that waits for a real pause.
const SEARCH_WHILE_TYPING_MS = 500;
const MAX_PAINTED_MATCHES = 1000;
const READ_TIMEOUT_MS = 10_000;
const WRITE_TIMEOUT_MS = 30_000;
const TOAST_MS = 1800;
const SEEN_CHECK_MS = 200;
// The server refuses an address past about 16 KB.
const MAX_CHECK_QUERY = 8000;
const PILL_DELAY_MS = 120;
const PILL_GAP_PX = 8;
// A draft write copies the whole note into storage, which is slow on long notes, so it waits for a real pause.
const DRAFT_DELAY_MS = 1000;
const POLL_MS = 3000;
const OFFLINE_HELP = "Check that the PC is on and Tailscale is connected, then pull down to reload.";

const $ = (id) => document.getElementById(id);
const editor = $("editor");
const decoder = new TextDecoder("utf-8", { ignoreBOM: true });
let doc = null;
let folder = null;
let saveTimer = 0;
let draftTimer = 0;
let composing = false;

const pathFor = (root, parts) => "/" + [root, ...parts].map(encodeURIComponent).join("/");
const parsePath = (path) => path.split("/").filter(Boolean).map(decodeURIComponent);
const whereText = (parents) => parents.join(" / ");

let rootsLoading = null;
let rootsByName = new Map();

function loadRoots() {
  if (rootsLoading) return rootsLoading;
  const asked = fetch("/api/roots")
    .then((res) => res.json())
    .then((roots) => {
      rootsByName = new Map(roots.map((root) => [root.name, root]));
      rememberSeen("roots", roots);
      rootsLoading = Promise.resolve(roots);
      return roots;
    })
    .catch((error) => {
      rootsLoading = null;
      throw error;
    });
  const known = recallSeen("roots");
  if (known) rootsByName = new Map(known.map((root) => [root.name, root]));
  rootsLoading = known ? Promise.resolve(known) : asked;
  asked.catch(() => {});
  return rootsLoading;
}

// The path as Windows or WSL writes it, or the folder names alone until the server has said.
function fullPath(root, parts) {
  const info = rootsByName.get(root);
  if (!info) return whereText([root, ...parts]);
  const separator = info.path.includes("\\") ? "\\" : "/";
  return [info.path.replace(/[\\/]$/, ""), ...parts].join(separator);
}
const apiQuery = (root, path) => `root=${encodeURIComponent(root)}&path=${encodeURIComponent(path)}`;

let redrawFolder = null;
const pins = new Set(recallSeen("pins") ?? []);

let pinSending = Promise.resolve();

// One at a time, so a quick pin and unpin can't reach the PC in the wrong order.
// Pins sent but not answered yet, so a list fetched meanwhile doesn't drop them.
const pinsInFlight = new Map();

function sendPin(href, pinned) {
  pinsInFlight.set(href, pinned);
  const sent = pinSending.then(() => fetch(`/api/pins?pin=${encodeURIComponent(href)}`, { method: pinned ? "PUT" : "DELETE", signal: AbortSignal.timeout(WRITE_TIMEOUT_MS) }));
  const settled = sent.catch(() => {});
  pinSending = settled;
  void settled.then(() => {
    if (pinsInFlight.get(href) === pinned) pinsInFlight.delete(href);
  });
  return sent;
}

// Pins used to live in each browser. The key goes only after the server has them all, so a dropped connection loses none.
async function moveBrowserPinsToServer() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("pins")); } catch {}
  if (!Array.isArray(saved)) return;
  for (const pin of saved) {
    // Pins saved before URLs became real paths start with "#". A pin of a folder no longer set up gets a 400 and is dropped.
    const res = await sendPin(pin.replace(/^#/, ""), true);
    if (res.status >= 500) throw new Error();
  }
  localStorage.removeItem("pins");
}

// Offline, the last known pins stay on screen.
async function refreshPins() {
  try {
    await moveBrowserPinsToServer();
    // Only briefly: a dead connection must not hold the list up.
    await Promise.race([pinSending, new Promise((done) => setTimeout(done, STATE_WAIT_MS))]);
    const res = await fetch("/api/pins", { signal: AbortSignal.timeout(READ_TIMEOUT_MS) });
    if (!res.ok) return;
    const saved = await res.json();
    pins.clear();
    for (const pin of saved) pins.add(pin);
    for (const [href, pinned] of pinsInFlight) {
      if (pinned) pins.add(href);
      else pins.delete(href);
    }
    rememberSeen("pins", [...pins]);
  } catch {}
}

// The last text, listing, folders and pins seen, so a note or folder shows at once, even right after the app opens,
// while the PC is asked again. This browser's storage already holds unsent drafts; the biggest notes are left out of it.
const SEEN_KEEP = 16;
const SEEN_MAX_CHARS = 400_000;
// Well under the ~5M characters a browser allows per site, so a draft always has room.
const SEEN_TOTAL_CHARS = 2_000_000;

const seenKeys = () => {
  try {
    return JSON.parse(localStorage.getItem("seen:keys")) ?? [];
  } catch {
    return [];
  }
};

function rememberSeen(key, value) {
  const older = seenKeys().filter((known) => known !== key);
  try {
    const text = JSON.stringify(value);
    if (text.length > SEEN_MAX_CHARS) {
      localStorage.removeItem(`seen:${key}`);
      localStorage.setItem("seen:keys", JSON.stringify(older));
      return;
    }
    const kept = [key];
    let total = text.length;
    for (const known of older.toReversed()) {
      const size = localStorage.getItem(`seen:${known}`)?.length ?? 0;
      if (kept.length < SEEN_KEEP && total + size <= SEEN_TOTAL_CHARS) {
        kept.unshift(known);
        total += size;
      } else localStorage.removeItem(`seen:${known}`);
    }
    localStorage.setItem(`seen:${key}`, text);
    localStorage.setItem("seen:keys", JSON.stringify(kept));
  } catch {}
}

function forgetSeen() {
  try {
    for (const key of seenKeys()) localStorage.removeItem(`seen:${key}`);
    localStorage.removeItem("seen:keys");
  } catch {}
}

function recallSeen(key) {
  try {
    return JSON.parse(localStorage.getItem(`seen:${key}`));
  } catch {
    return null;
  }
}

// The slide to a new screen starts as soon as that screen has something to show.
let markScreenReady = () => {};

let changedPins = new Set();
let folderChanged = new Set();

let pinsTurn = 0;
let folderTurn = 0;

// Polls can overlap on a slow link, so only the newest answer is kept.
async function refreshChangedPins() {
  if (!pins.size) return;
  const turn = ++pinsTurn;
  const batches = [[]];
  for (const pin of pins) {
    const part = `note=${encodeURIComponent(pin)}`;
    if (batches.at(-1).join("&").length + part.length > MAX_CHECK_QUERY) batches.push([]);
    batches.at(-1).push(part);
  }
  try {
    const answers = await Promise.all(batches.map(async (batch) => {
      const query = batch.join("&");
      const res = await fetch(`/api/changed?${query}`, { signal: AbortSignal.timeout(READ_TIMEOUT_MS) });
      if (!res.ok) throw new Error();
      return res.json();
    }));
    if (turn === pinsTurn) changedPins = new Set(answers.flat());
  } catch {}
}

function togglePin(href) {
  const pinned = !pins.delete(href);
  if (pinned) pins.add(href);
  return pinned;
}

// Runs on every keystroke, so it must not touch the DOM when nothing changed.
function setStatus(text, tone = "") {
  const status = $("status");
  if (status.textContent !== text) status.textContent = text;
  if (status.dataset.tone !== tone) status.dataset.tone = tone;
}

function showWhere(id, root, parts) {
  const paint = () => {
    const path = root ? fullPath(root, parts) : "";
    const text = document.createElement("bdi");
    text.textContent = path;
    $(id).replaceChildren(...(path ? [text] : []));
    $(id).title = path;
  };
  paint();
  if (root) loadRoots().then(paint, () => {});
}

function show(screen, title, root, parts = []) {
  $("list-screen").hidden = screen !== "list";
  $("edit-screen").hidden = screen !== "edit";
  document.title = title;
  const heading = $(screen === "list" ? "list-title" : "edit-title");
  $(screen === "list" ? "list-title" : "edit-name").textContent = title;
  showWhere(screen === "list" ? "list-where" : "edit-where", root, parts);
  heading.focus({ preventScroll: true });
}

// ---- Folder view ----

function icon(name, className) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", `icon ${className}`);
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", name);
  svg.append(use);
  return svg;
}

function buildDot() {
  const dot = document.createElement("span");
  dot.className = "changed";
  const spoken = document.createElement("span");
  spoken.className = "for-screen-readers";
  spoken.textContent = "Changed since you last read it";
  dot.append(spoken);
  return dot;
}

function showDots(list, changed) {
  for (const row of list.children) {
    const label = row.querySelector(".is-file > span");
    const dot = label?.querySelector(".changed");
    if (!label || Boolean(dot) === changed.has(row.dataset.key)) continue;
    if (dot) dot.remove();
    else label.firstChild.after(buildDot());
  }
}

// The AI keeps writing while a list is open, so its dots follow without a reload.
async function refreshDots() {
  const openedAt = location.pathname;
  if (!folder) {
    await refreshChangedPins();
    if (location.pathname === openedAt) showDots($("pinned"), changedPins);
    return;
  }
  const { root, parts } = folder;
  const turn = ++folderTurn;
  try {
    const res = await fetch(`/api/list?${apiQuery(root, parts.join("/"))}`, { signal: AbortSignal.timeout(READ_TIMEOUT_MS) });
    if (!res.ok || location.pathname !== openedAt || turn !== folderTurn) return;
    const { changed = [] } = await res.json();
    if (location.pathname !== openedAt || turn !== folderTurn) return;
    folderChanged = new Set(changed.map((name) => pathFor(root, [...parts, name])));
    showDots($("items"), folderChanged);
  } catch {}
}

function buildRow({ href, label, isFile, hint, changed }) {
  const row = document.createElement("li");
  row.dataset.key = href;
  const link = document.createElement("a");
  link.href = href;
  if (isFile) link.className = "is-file";
  const text = document.createElement("span");
  text.textContent = label;
  if (changed) text.append(buildDot());
  if (hint) {
    const where = document.createElement("small");
    where.textContent = hint;
    text.append(where);
  }
  link.append(icon(isFile ? "#i-file" : "#i-folder", "kind"), text);
  if (!isFile) link.append(icon("#i-next", "chevron"));
  row.append(link);
  if (isFile) row.append(buildPinButton(href, hint || label));
  return row;
}

function buildPinButton(href, name) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "pin";
  button.setAttribute("aria-label", `Pin ${name}`);
  button.setAttribute("aria-pressed", String(pins.has(href)));
  button.append(icon("#i-pin", ""));
  const flip = () => {
    const pinned = togglePin(href);
    button.setAttribute("aria-pressed", String(pinned));
    if (redrawFolder) moveRows(redrawFolder, href);
    return pinned;
  };
  button.addEventListener("click", async () => {
    const pinned = flip();
    const saved = await sendPin(href, pinned).then((res) => res.ok, () => false);
    if (saved) return;
    flip();
    showToast("Pin not saved. Check the connection to the PC.");
  });
  return button;
}

function renderItems(links, emptyText) {
  $("items").replaceChildren(...links.map(buildRow));
  $("items").hidden = links.length === 0;
  $("message").hidden = links.length > 0;
  $("message").textContent = links.length ? "" : emptyText;
}

function renderPinned() {
  const rows = [...pins]
    .map((href) => {
      const [root, ...parts] = parsePath(href);
      return { href, isFile: true, label: parts.at(-1), hint: fullPath(root, parts), changed: changedPins.has(href) };
    })
    .sort((a, b) => a.label.localeCompare(b.label) || a.hint.localeCompare(b.hint));
  $("pinned").replaceChildren(...rows.map(buildRow));
  $("pinned-section").hidden = rows.length === 0;
}

// Slides each row from its old place to its new one, so a pinned file visibly goes to the top.
function moveRows(redraw, movedKey) {
  const rows = () => [...$("items").children];
  const before = new Map(rows().map((row) => [row.dataset.key, row.getBoundingClientRect().top]));
  redraw();
  const moved = rows().find((row) => row.dataset.key === movedKey);
  moved?.querySelector(".pin").focus({ preventScroll: true });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (const row of rows()) {
    const top = row.getBoundingClientRect().top;
    const from = before.get(row.dataset.key);
    const onScreen = (y) => y > -row.offsetHeight && y < innerHeight;
    if (from === top || (!onScreen(from) && !onScreen(top))) continue;
    row.animate(
      { translate: [`0 ${from - top}px`, "0 0"], zIndex: row === moved ? [1, 1] : [0, 0] },
      { duration: 200, easing: "cubic-bezier(0.2, 0, 0, 1)" },
    );
  }
}

function closeNewForm() {
  $("new-form").hidden = true;
  $("new-file").setAttribute("aria-expanded", "false");
  $("new-file").textContent = "New file";
}

async function showRoots() {
  folder = null;
  redrawFolder = null;
  const openedAt = location.pathname;
  show("list", "MD Phone");
  $("list-back").hidden = true;
  $("new-file").hidden = true;
  $("new-where-field").hidden = true;
  closeNewForm();
  renderItems([], "Opening…");
  $("root-groups").replaceChildren();
  $("pinned-section").hidden = true;
  const pinsLoading = refreshPins();
  try {
    const roots = await loadRoots();
    if (location.pathname !== openedAt) return;
    renderItems([], "No folders are set up. Add one to roots.json on the PC.");
    $("message").hidden = roots.length > 0;
    renderRootGroups(roots);
    showHomeNewFile(roots);
  } catch {
    if (location.pathname !== openedAt) return;
    renderItems([], `Unable to reach the PC. ${OFFLINE_HELP}`);
  }
  renderPinned();
  markScreenReady();
  await pinsLoading;
  if (location.pathname !== openedAt) return;
  renderPinned();
  refreshDots();
}

// A new note from the home screen goes to the root named "desktop" unless another folder is picked.
const HOME_NEW_FILE_ROOT = "desktop";

function showHomeNewFile(roots) {
  if (!roots.length) return;
  $("new-where").replaceChildren(...roots.map(({ name, path }) => {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = `${name} (${path})`;
    return option;
  }));
  $("new-where").value = roots.some(({ name }) => name === HOME_NEW_FILE_ROOT) ? HOME_NEW_FILE_ROOT : roots[0].name;
  $("new-where-field").hidden = false;
  $("new-file").hidden = false;
}

function renderRootGroups(roots) {
  const systems = [...new Set(roots.map((root) => root.system))];
  $("root-groups").replaceChildren(...systems.map((system) => {
    const group = document.createElement("section");
    group.setAttribute("aria-label", system);
    const heading = document.createElement("h2");
    heading.className = "list-heading";
    heading.textContent = system;
    const list = document.createElement("ul");
    list.className = "rows";
    list.append(...roots
      .filter((root) => root.system === system)
      .map(({ name, path }) => buildRow({ href: pathFor(name, []), label: name, hint: path })));
    group.append(heading, list);
    return group;
  }));
}

async function showFolder(root, parts) {
  redrawFolder = null;
  const openedAt = location.pathname;
  show("list", parts.at(-1) ?? root, root, parts);
  $("root-groups").replaceChildren();
  $("list-back").hidden = false;
  $("list-back").href = parts.length ? pathFor(root, parts.slice(0, -1)) : "/";
  $("new-file").hidden = true;
  $("new-where-field").hidden = true;
  $("pinned-section").hidden = true;
  closeNewForm();
  folder = { root, parts };
  const query = apiQuery(root, parts.join("/"));
  const shown = recallSeen(`list:${query}`);
  if (shown) renderFolder(root, parts, shown);
  else renderItems([], "Opening…");
  try {
    // Newer than any dots poll still in flight for this folder.
    folderTurn++;
    const [res] = await Promise.all([fetch(`/api/list?${query}`), refreshPins()]);
    if (!res.ok) throw new Error(await res.text());
    const listing = await res.json();
    if (location.pathname !== openedAt) return;
    rememberSeen(`list:${query}`, listing);
    renderFolder(root, parts, listing);
  } catch {
    if (location.pathname === openedAt && !shown) renderItems([], `Unable to open this folder. ${OFFLINE_HELP}`);
    markScreenReady();
  }
}

function renderFolder(root, parts, { dirs, files, changed = [] }) {
  const hrefOf = (name) => pathFor(root, [...parts, name]);
  folderChanged = new Set(changed.map(hrefOf));
  const fileRow = (name) => ({ href: hrefOf(name), label: name, isFile: true, changed: folderChanged.has(hrefOf(name)) });
  redrawFolder = () => renderItems([
    ...files.filter((name) => pins.has(hrefOf(name))).map(fileRow),
    ...dirs.map((name) => ({ href: hrefOf(name), label: name })),
    ...files.filter((name) => !pins.has(hrefOf(name))).map(fileRow),
  ], "No markdown files here yet. Tap New file to add one.");
  $("new-file").hidden = false;
  redrawFolder();
  markScreenReady();
}

$("new-file").addEventListener("click", () => {
  if (!$("new-form").hidden) {
    closeNewForm();
    return;
  }
  $("new-name").value = "";
  $("new-name").removeAttribute("aria-invalid");
  $("new-error").hidden = true;
  $("new-form").hidden = false;
  $("new-file").setAttribute("aria-expanded", "true");
  $("new-file").textContent = "Cancel";
  $("new-name").focus();
});

// From the name or the folder picker; an open picker takes its own Escape first.
$("new-form").addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  closeNewForm();
  $("new-file").focus();
});

$("new-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const fromHome = !folder;
  const { root, parts } = folder ?? { root: $("new-where").value, parts: [] };
  let problem;
  $("new-create").disabled = true;
  try {
    const query = `${apiQuery(root, parts.join("/"))}&name=${encodeURIComponent($("new-name").value)}`;
    const res = await fetch(`/api/create?${query}`, { method: "PUT" });
    if (res.ok) {
      const { name } = await res.json();
      const href = pathFor(root, [...parts, name]);
      // Pinned, or a note made from the home screen would only be found by opening its folder.
      if (fromHome && !pins.has(href)) {
        togglePin(href);
        sendPin(href, true)
          .then((res) => {
            if (!res.ok) throw new Error();
          })
          .catch(() => {
            pins.delete(href);
            showToast(`Note created, but not pinned. Find it in the ${root} folder.`);
          });
      }
      navigate(href);
      return;
    }
    problem = await res.text();
  } catch {
    problem = "Unable to reach the PC. Check your connection and try again.";
  } finally {
    $("new-create").disabled = false;
  }
  $("new-error").textContent = problem;
  $("new-error").hidden = false;
  $("new-name").setAttribute("aria-invalid", "true");

// ---- Renaming the open note ----

function closeRenameForm() {
  $("rename-form").hidden = true;
  $("rename-open").setAttribute("aria-expanded", "false");
}

$("rename-open").addEventListener("click", () => {
  if (!$("rename-form").hidden) {
    closeRenameForm();
    return;
  }
  const name = $("edit-name").textContent;
  $("rename-name").value = name;
  $("rename-name").removeAttribute("aria-invalid");
  $("rename-error").hidden = true;
  $("rename-form").hidden = false;
  $("rename-open").setAttribute("aria-expanded", "true");
  $("rename-name").focus();
  // The name is selected without .md, so typing replaces just the part people change.
  $("rename-name").setSelectionRange(0, name.replace(/\.md$/i, "").length);
});

$("rename-form").addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  closeRenameForm();
  $("rename-open").focus();
});

$("rename-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const current = doc;
  if (!current || current.base === null) return;
  const [root, ...parts] = parsePath(location.pathname);
  let problem;
  $("rename-save").disabled = true;
  editor.readOnly = true;
  try {
    // Text and marks go out under the old name first, so the PC moves them with the file and nothing is left behind.
    await save();
    while (current.saving) await new Promise((done) => setTimeout(done, 100));
    await save();
    await pushState(current);
    keepScroll();
    if (doc !== current) return;
    if (current.conflict || isDirty(current) || current.stateDirty) {
      problem = "Unable to save this note first, so it kept its name. Check your connection and try again.";
    } else {
      const query = `${apiQuery(root, parts.join("/"))}&name=${encodeURIComponent($("rename-name").value)}`;
      const res = await fetch(`/api/rename?${query}`, { method: "PUT" });
      if (doc !== current) return;
      if (res.ok) {
        const { name } = await res.json();
        const href = pathFor(root, [...parts.slice(0, -1), name]);
        if (pins.delete(current.href)) {
          pins.add(href);
          rememberSeen("pins", [...pins]);
        }
        rememberSeen(`note:${href}`, { raw: toDisk(current, current.saved), etag: current.base });
        // Everything was saved above, so the note reopens under its new name with nothing to send for the old one.
        doc = null;
        history.replaceState(null, "", href);
        currentPath = location.pathname;
        route();
        return;
      }
      problem = await res.text();
    }
  } catch {
    problem = "Unable to reach the PC. Check your connection and try again.";
  } finally {
    $("rename-save").disabled = false;
    if (doc === current) editor.readOnly = false;
  }
  $("rename-error").textContent = problem;
  $("rename-error").hidden = false;
  $("rename-name").setAttribute("aria-invalid", "true");
  $("rename-name").focus();
});

// ---- Draft kept on the phone, so a dropped connection or a killed tab loses nothing ----

function keepDraft(current) {
  clearTimeout(draftTimer);
  const draft = JSON.stringify({ text: editor.value, base: current.base, at: Date.now(), conflict: current.conflict });
  try {
    localStorage.setItem(current.draftKey, draft);
  } catch {
    // Unsent text matters more than the copies kept for opening fast.
    forgetSeen();
    try {
      localStorage.setItem(current.draftKey, draft);
    } catch {}
  }
}
function clearDraft(current) {
  clearTimeout(draftTimer);
  try { localStorage.removeItem(current.draftKey); } catch {}
}
function readDraft(current) {
  try { return JSON.parse(localStorage.getItem(current.draftKey)); } catch { return null; }
}
// The save finished, maybe after leaving the note, so what's kept must not look unsaved or based on the older version.
function settleDraft(current, sent) {
  const draft = readDraft(current);
  if (!draft) return;
  try {
    if (draft.text === sent) localStorage.removeItem(current.draftKey);
    else localStorage.setItem(current.draftKey, JSON.stringify({ ...draft, base: current.base }));
  } catch {}
}

function flushDraft() {
  if (!doc || doc.base === null) return;
  if (isDirty(doc)) keepDraft(doc);
  else clearDraft(doc);
}

// ---- Editor ----

const isDirty = (current) => editor.value !== current.saved;
// A textarea always reports "\n", so a Windows file gets its "\r\n" back on save.
const toDisk = (current, text) => (current.crlf ? text.replace(/\n/g, "\r\n") : text);
const fromDisk = (text) => text.replace(/\r\n?/g, "\n");
const fetchFile = (current, headers = {}) => fetch(current.url, { cache: "no-store", headers, signal: AbortSignal.timeout(READ_TIMEOUT_MS) });

function adoptVersion(current, raw, version) {
  current.triedTexts = [];
  current.base = version;
  current.crlf = raw.includes("\r\n");
  current.saved = fromDisk(raw);
}

let paintedLines = [];
let paintedText = "";
let lineEls = [];
let paintedHeadings = [];

function buildLine(text) {
  const el = document.createElement("div");
  el.textContent = text;
  return el;
}

// Runs on every keystroke, so only the lines that changed touch the DOM; a whole rebuild took 64ms at 200K characters.
function paintNote() {
  clearStepDiff();
  clearReviewDiff();
  const text = editor.value;
  const lines = text.split("\n");
  const shortest = Math.min(lines.length, paintedLines.length);
  let head = 0;
  while (head < shortest && lines[head] === paintedLines[head]) head++;
  let tail = 0;
  while (tail < shortest - head && lines[lines.length - 1 - tail] === paintedLines[paintedLines.length - 1 - tail]) tail++;

  const gone = lineEls.slice(head, lineEls.length - tail);
  const fresh = lines.slice(head, lines.length - tail).map(buildLine);
  const after = lineEls[lineEls.length - tail] ?? null;
  const batch = document.createDocumentFragment();
  for (const el of fresh) batch.append(el);
  for (const el of gone) el.remove();
  $("painted").insertBefore(batch, after);
  lineEls = [...lineEls.slice(0, head), ...fresh, ...lineEls.slice(lineEls.length - tail)];
  paintedLines = lines;
  lineStarts = null;
  const previousText = paintedText;
  paintedText = text;

  const next = parseHeadings(text).map((heading) => ({ ...heading, el: lineEls[heading.line] }));
  const colored = new Set(next.map(({ el }) => el));
  for (const { el } of paintedHeadings) if (!colored.has(el)) el.className = "";
  for (const { el, level } of next) if (el.className !== `h${level}`) el.className = `h${level}`;
  paintedHeadings = next;
  if (doc?.marks.length) {
    const followed = followEdit(doc.marks, diff(previousText, text), text);
    if (followed !== doc.marks) setMarks(doc, followed);
    else showMarksInNote(doc);
  }
  refreshSearchSoon();
  refreshReadingSoon();
}

function setEditorText(text) {
  editor.value = text;
  paintNote();
}

// ---- Changes since the last review, compared with the reviewed copy kept on the PC ----

const reviewedKey = (current) => `reviewed:${current.draftKey.slice("draft:".length)}`;
const hasChanges = (current) => current?.reviewed !== null && current?.reviewed !== undefined && current.reviewed !== editor.value;

let noteScrollBeforeChanges = 0;
const changesOpen = () => !$("changes-view").hidden;

function showChangesHint() {
  // Hiding the button that has focus would drop a keyboard user's place to the page itself.
  if (!hasChanges(doc) && document.activeElement === $("changes-open")) $("edit-title").focus({ preventScroll: true });
  $("changes-open").hidden = !hasChanges(doc);
  if (!changesOpen()) return;
  if (hasChanges(doc)) renderChanges();
  else closeChanges();
}

function openChanges() {
  if (!hasChanges(doc) || changesOpen()) return;
  closeReading({ remember: false });
  clearReviewDiff();
  closeSearch({ moveFocus: false });
  keepScroll();
  noteScrollBeforeChanges = $("note").scrollTop;
  hideMarkPill();
  $("note").hidden = true;
  $("changes-view").hidden = false;
  $("changes-open").setAttribute("aria-pressed", "true");
  renderChanges();
  const first = $("changes-view").querySelector(".change.added, .change.removed");
  if (first) $("changes-view").scrollTop = first.closest(".hunk").offsetTop - $("changes-actions").offsetHeight;
}

function closeChanges() {
  if (!changesOpen()) return;
  // Mark as reviewed and Discard close this view while they still have focus.
  if ($("changes-view").contains(document.activeElement)) ($("changes-open").hidden ? $("edit-title") : $("changes-open")).focus({ preventScroll: true });
  $("changes-view").hidden = true;
  $("note").hidden = false;
  $("changes-open").setAttribute("aria-pressed", "false");
  $("note").scrollTop = noteScrollBeforeChanges;
  showReviewDiff();
}

$("changes-open").addEventListener("click", () => (changesOpen() ? closeChanges() : openChanges()));

function loadReviewed(current, stored) {
  // A draft is your own text, so it never counts as a change to review.
  const base = stored ?? current.saved;
  current.reviewed = base === current.saved ? editor.value : base;
  showChangesHint();
}

function followOwnEdit(textBefore) {
  if (!doc || doc.reviewed === null) return;
  doc.reviewed = doc.reviewed === textBefore ? editor.value : applyOwnEdit(doc.reviewed, textBefore, diff(textBefore, editor.value));
  showChangesHint();
}

function buildChangeRow({ kind, text, parts }) {
  const row = document.createElement("div");
  row.className = `change ${kind}`;
  const sign = document.createElement("span");
  sign.className = "sign";
  sign.setAttribute("aria-hidden", "true");
  sign.textContent = kind === "added" ? "+" : kind === "removed" ? "−" : "";
  const label = document.createElement("span");
  label.className = "for-screen-readers";
  label.textContent = kind === "added" ? "Added: " : kind === "removed" ? "Removed: " : "";
  const body = document.createElement("span");
  body.className = "change-text";
  if (parts) {
    for (const part of parts) {
      if (part.changed) {
        const word = document.createElement(kind === "added" ? "ins" : "del");
        word.textContent = part.text;
        body.append(word);
      } else {
        body.append(part.text);
      }
    }
  } else {
    body.textContent = text;
  }
  row.append(sign, label, body);
  return row;
}

function renderChanges() {
  const { hunks, added, removed } = buildHunks(doc.reviewed ?? editor.value, editor.value);
  $("changes-count").textContent = `+${added} −${removed}`;
  $("changes-list").replaceChildren(...hunks.map(({ line, rows }) => {
    const hunk = document.createElement("section");
    hunk.className = "hunk";
    const go = document.createElement("button");
    go.type = "button";
    go.className = "hunk-go";
    go.append(`Go to line ${Math.min(line, lineEls.length)}`, icon("#i-next", ""));
    // Removed rows all carry the line they sat before, so each also needs its place in that run.
    let run = 0;
    const els = rows.map((row, index) => {
      const nth = row.kind === "removed" && rows[index - 1]?.kind === "removed" ? ++run : (run = 0);
      const el = buildChangeRow(row);
      el.addEventListener("click", () => {
        // Selecting text to copy ends in a click too.
        if (!getSelection().isCollapsed) return;
        showRowInNote(row, nth, el.getBoundingClientRect().top);
      });
      return { row, nth, el };
    });
    go.addEventListener("click", () => {
      const first = els.find(({ row }) => row.kind !== "same");
      showRowInNote(first.row, first.nth, first.el.getBoundingClientRect().top);
    });
    hunk.append(go, ...els.map(({ el }) => el));
    return hunk;
  }));
}

$("mark-reviewed").addEventListener("click", () => {
  doc.reviewed = editor.value;
  doc.reviewConfirmed = true;
  doc.stateDirty = true;
  pushState(doc);
  showChangesHint();
  showToast("Marked as reviewed");
});

// Undo brings the changes back, so this needs no confirmation.
$("discard-changes").addEventListener("click", () => {
  editor.setRangeText(doc.reviewed, 0, editor.value.length, "start");
  closeChanges();
  noteChanged();
  trackChange({ separate: true, keepsReview: true });
  showChangesHint();
  showToast("Changes discarded. Undo brings them back.");
});

// ---- Marks, undo steps and the reviewed copy, stored on the PC so every device shares them ----

let stateTimer = 0;
const stateUrl = (current, kind) => `/api/state?kind=${kind}&note=${encodeURIComponent(current.href)}`;
const localKeys = (current) => ["marks", "undo", "reviewed", "scroll"].map((kind) => `${kind}:${current.draftKey.slice("draft:".length)}`);

function showUndoButtons(history) {
  $("undo").hidden = !history?.done.length;
  $("redo").hidden = !history?.undone.length;
}

function scheduleState(current) {
  if (!current?.history) return;
  current.stateDirty = true;
  clearTimeout(stateTimer);
  stateTimer = setTimeout(() => pushState(current), HISTORY_DELAY_MS);
}

function stateNow(current) {
  const { done, undone, text } = current.history;
  return { marks: current.marks, removedMarks: current.removedMarks, reviewed: current.reviewed, reviewConfirmed: current.reviewConfirmed, history: { done: [...done], undone: [...undone], hash: hashText(text) } };
}

// Undo steps and the review only make sense for their own text. For other text, they wait until that text arrives here.
function applyMerged(current, merged) {
  setMarks(current, relocate(merged.marks, editor.value), { share: false });
  if (merged.history.hash !== hashText(editor.value)) {
    if (merged.history.hash === current.synced?.remote.history.hash) applyReview(current, merged);
    return;
  }
  Object.assign(current.history, { text: editor.value, done: [...merged.history.done], undone: [...merged.history.undone], at: 0 });
  showUndoButtons(current.history);
  applyReview(current, merged);
}

function applyReview(current, merged) {
  current.reviewed = merged.reviewed;
  current.reviewConfirmed = merged.reviewConfirmed;
  showChangesHint();
  if (reviewDiff) showReviewDiff({ base: lingeringBase() });
}

async function sendState(current) {
  while (current.stateDirty) {
    current.stateDirty = false;
    let mine = stateNow(current);
    let settled = false;
    let tag = current.stateTag;
    try {
      let body = mergeState(current.synced, mine, current.synced?.remote ?? null, current.conflict);
      for (let tries = 0; tries < STATE_WRITE_TRIES && !settled; tries++) {
        const upload = await packed(JSON.stringify(body));
        const res = await fetch(stateUrl(current, "note"), {
          method: "PUT",
          headers: { ...(tag ? { "If-Match": tag } : { "If-None-Match": "*" }), ...upload.headers },
          body: upload.body,
          signal: AbortSignal.timeout(WRITE_TIMEOUT_MS),
          // A hidden tab may be closed, and only keepalive requests outlive that. Browsers fail them above 64 KB of bytes.
          keepalive: document.hidden && upload.body.length < 60_000,
        });
        if (res.ok) {
          current.stateTag = res.headers.get("ETag");
          current.synced = { local: mine, remote: body };
          settled = true;
        } else if (res.status === 412) {
          const fresh = await fetchNoteState(current);
          mine = stateNow(current);
          tag = fresh.tag ?? null;
          body = mergeState(current.synced, mine, fresh.value, current.conflict);
          if (doc === current) {
            applyMerged(current, body);
            mine = stateNow(current);
          }
        } else {
          break;
        }
      }
    } catch {}
    if (!settled) {
      current.stateDirty = true;
      keepPending(current);
      return;
    }
  }
  if (!current.conflict) clearPending(current);
  clearLocalState(current);
}

// What the PC hasn't got yet survives leaving the note or the tab being closed, and goes out when the note next opens.
const pendingKey = (current) => `pending:${current.draftKey.slice("draft:".length)}`;

function keepPending(current) {
  try { localStorage.setItem(pendingKey(current), JSON.stringify({ synced: current.synced, mine: stateNow(current) })); } catch {}
}

function clearPending(current) {
  try { localStorage.removeItem(pendingKey(current)); } catch {}
}

function readPending(current) {
  try { return JSON.parse(localStorage.getItem(pendingKey(current))); } catch { return null; }
}

function leaveState(current) {
  if (!current?.history) return;
  if (current.stateDirty || current.pushing || current.conflict) keepPending(current);
  return pushState(current);
}

// Only ever waits briefly: a slow state write must never hold back the text itself.
const settleState = (current) => Promise.race([pushState(current), new Promise((done) => setTimeout(done, STATE_WAIT_MS))]);

// Runs before each file save, so a device that sees the new text can already tell it came from another device, not an AI.
function pushState(current) {
  if (current?.pushing) return current.pushing;
  if (!current?.stateDirty || !current.stateLoaded) return Promise.resolve();
  clearTimeout(stateTimer);
  current.pushing = sendState(current).finally(() => { current.pushing = null; });
  return current.pushing;
}

// Big uploads go gzipped, since the phone's link to the PC can be slow; small ones aren't worth the work.
const PACK_FROM_BYTES = 16_000;

async function packed(text) {
  const bytes = new TextEncoder().encode(text);
  if (bytes.length < PACK_FROM_BYTES || !window.CompressionStream) return { body: bytes, headers: {} };
  const zipped = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
  return { body: new Uint8Array(await new Response(zipped).arrayBuffer()), headers: { "Content-Encoding": "gzip" } };
}

async function fetchJson(url, headers) {
  const res = await fetch(url, { headers, signal: AbortSignal.timeout(READ_TIMEOUT_MS) });
  if (res.status === 404) return { value: null };
  if (res.status === 304) return { unchanged: true };
  if (!res.ok) throw new Error();
  return { value: await res.json().catch(() => null), tag: res.headers.get("ETag") };
}

// A malformed state counts as none, or the note could never be edited again.
async function fetchNoteState(current, headers) {
  const answer = await fetchJson(stateUrl(current, "note"), headers);
  const { value } = answer;
  return value && (!Array.isArray(value.marks) || !Array.isArray(value.history?.done) || !Array.isArray(value.history?.undone)) ? { ...answer, value: null } : answer;
}

function adoptState(current, { value, tag }) {
  clearTimeout(stateTimer);
  current.stateDirty = false;
  current.stateTag = tag;
  applyMerged(current, value);
  current.synced = { local: stateNow(current), remote: value };
}

// Steps for other text mean the new text hasn't reached this device yet, so the next check tries again.
async function pullState(current) {
  if (current.stateDirty || current.pushing) return pushState(current);
  const remote = await fetchNoteState(current, current.stateTag ? { "If-None-Match": current.stateTag } : {});
  if (remote.unchanged || !remote.value || doc !== current || current.stateDirty || current.pushing) return;
  if (remote.value.history.hash === hashText(editor.value)) {
    adoptState(current, remote);
  } else if (remote.value.history.hash === current.synced?.remote.history.hash) {
    // The text didn't move, so only marks or the review did. This happens after an edit made with no device open.
    const merged = mergeState(current.synced, stateNow(current), remote.value, current.conflict);
    setMarks(current, relocate(merged.marks, editor.value), { share: false });
    applyReview(current, merged);
    current.stateTag = remote.tag;
    current.synced = { local: stateNow(current), remote: remote.value };
  }
}

// Browsers used to keep all this themselves. What the phone stored is merged in once, and removed only after the PC has it.
function readLocalState(current) {
  const [marksKey, undoKey, reviewedKey, scrollKey] = localKeys(current);
  try {
    const marks = JSON.parse(localStorage.getItem(marksKey)) ?? [];
    return {
      marks: marks.map((mark) => (mark.line === undefined ? mark : createMark(editor.value, lineStart(mark.line)))),
      history: JSON.parse(localStorage.getItem(undoKey)),
      reviewed: localStorage.getItem(reviewedKey),
      scrollTop: Number(localStorage.getItem(scrollKey)) || 0,
    };
  } catch {
    return { marks: [], history: null, reviewed: null, scrollTop: 0 };
  }
}

function clearLocalState(current) {
  try {
    for (const key of localKeys(current)) localStorage.removeItem(key);
    localStorage.removeItem("reviewed-order");
  } catch {}
}

// A review someone pressed outranks an older copy. A copy made just by opening the note on another device doesn't.
function oldBrowserChanges(local, saved) {
  if (!local.marks.length && local.reviewed === null && !local.history?.done?.length && !local.history?.undone?.length) return null;
  const serverSteps = saved?.history?.hash === local.history?.hash && saved?.history?.done.length;
  return {
    synced: saved ? { local: { marks: [] }, remote: saved } : null,
    mine: {
      marks: local.marks,
      reviewed: saved?.reviewConfirmed ? saved.reviewed : local.reviewed ?? saved?.reviewed ?? null,
      reviewConfirmed: saved?.reviewConfirmed ?? false,
      history: serverSteps ? saved.history : local.history ?? null,
    },
  };
}

function withOlderChanges(remote, changes, hash, textInConflict) {
  if (!changes) return remote;
  // Steps for text that is no longer here would restore into the wrong place.
  if (changes.mine.history?.hash !== hash) changes.mine.history = changes.synced?.local.history ?? remote?.history ?? null;
  return mergeState(changes.synced, changes.mine, remote, textInConflict);
}

async function loadState(current, remoteRequest) {
  let remote = null;
  try {
    remote = await remoteRequest;
  } catch {}
  if (doc !== current || !remote || current.stateLoaded) return;
  const saved = remote.value;
  const hash = hashText(editor.value);
  const pending = readPending(current);
  const heldBack = current.conflict && pending?.mine.history?.hash === hash ? pending.mine : null;
  const merged = withOlderChanges(withOlderChanges(saved, oldBrowserChanges(readLocalState(current), saved), hash, false), pending, hash, current.conflict);
  const changed = JSON.stringify(merged) !== JSON.stringify(saved);
  const stepsFit = merged?.history?.hash === hash;
  current.history = createHistory(editor.value);
  const steps = heldBack?.history ?? (stepsFit ? merged.history : null);
  if (steps) Object.assign(current.history, { done: [...steps.done], undone: [...steps.undone] });
  showUndoButtons(current.history);
  current.removedMarks = merged?.removedMarks ?? [];
  setMarks(current, relocate(merged?.marks ?? [], editor.value), { share: false });
  current.reviewConfirmed = merged?.reviewConfirmed ?? false;
  loadReviewed(current, heldBack?.reviewed ?? merged?.reviewed ?? null);
  current.stateTag = remote.tag ?? null;
  current.stateLoaded = true;
  if (saved) {
    const now = stateNow(current);
    current.synced = {
      local: {
        marks: saved.marks,
        reviewed: changed && merged.reviewed !== saved.reviewed ? undefined : now.reviewed,
        reviewConfirmed: changed && merged.reviewConfirmed !== saved.reviewConfirmed ? undefined : now.reviewConfirmed,
        history: changed && stepsFit && JSON.stringify(merged.history) !== JSON.stringify(saved.history) ? undefined : now.history,
      },
      remote: saved,
    };
  }
  // Changes made while no device had the note open come with no undo step, and reading them accepts them.
  // One step from the last read text lets Undo bring back anything they removed.
  // Added after the synced copy is taken, so the merge counts it as this device's change.
  const stepForAway = !steps && !current.conflict && current.reviewed !== editor.value;
  if (stepForAway) {
    current.history.text = current.reviewed;
    record(current.history, editor.value, Date.now(), { separate: true });
    showUndoButtons(current.history);
    scheduleState(current);
  }
  if (saved && !changed) {
    if (!current.conflict) clearPending(current);
    clearLocalState(current);
    return;
  }
  current.stateDirty = true;
  await settleState(current);
}

function trackChange(options) {
  if (!doc?.history) return;
  record(doc.history, editor.value, Date.now(), options);
  showUndoButtons(doc.history);
  scheduleState(doc);
}

let stepDiffRemoved = null;

function clearStepDiff() {
  CSS.highlights?.delete("just-added");
  if (!stepDiffRemoved) return;
  const line = stepDiffRemoved.parentNode;
  stepDiffRemoved.remove();
  stepDiffRemoved = null;
  line.normalize();
}

function textPoint(offset, { start = false } = {}) {
  const { line, column } = lineAndColumn(offset);
  return pointInLine(line, column, start);
}

// `start` asks for the point after anything inserted at that spot, for a range that begins there.
function pointInLine(line, column, start = false) {
  const el = lineEls[line];
  let left = column;
  for (const node of el.childNodes) {
    if (node.nodeType !== Node.TEXT_NODE) continue;
    if (left < node.length || (left === node.length && !start)) return [node, left];
    left -= node.length;
  }
  return [el, el.childNodes.length];
}

// The removed text goes after the caret, so the textarea's caret still lines up with the painted text above it.
function showStepDiff(start, caret, removed) {
  if (caret > start) {
    const added = document.createRange();
    added.setStart(...textPoint(start));
    added.setEnd(...textPoint(caret));
    if (window.Highlight) CSS.highlights.set("just-added", new Highlight(added));
  }
  if (!removed) return;
  stepDiffRemoved = document.createElement("del");
  stepDiffRemoved.textContent = removed;
  const at = document.createRange();
  at.setStart(...textPoint(caret));
  at.insertNode(stepDiffRemoved);
}

// ---- Changes someone else made, shown in the note until each has been on screen long enough to read ----

let reviewDiff = null;
let lastInline = null;

function removeStruck(dels) {
  for (const el of dels) {
    const line = el.parentNode;
    if (!line) continue;
    el.remove();
    line.normalize();
  }
}

function clearReviewDiff() {
  if (!reviewDiff) return;
  clearInterval(reviewDiff.timer);
  CSS.highlights?.delete("review-added");
  CSS.highlights?.delete("review-fading");
  for (const piece of reviewDiff.pieces) removeStruck(piece.dels);
  $("note-sheet").classList.remove("reviewing");
  reviewDiff = null;
}

// Struck-out text coming or going above the reader would move the text they are on, so that text's own line is the anchor.
// Measured on screen: Chrome's own scroll anchoring sometimes corrects first, and then nothing is left to correct.
function keepReadingSpot(work) {
  if ($("note").hidden || !lineEls.length) return work();
  const line = topVisibleLine();
  const before = lineTextTop(line) - $("note").scrollTop;
  work();
  $("note").scrollTop += lineTextTop(line) - $("note").scrollTop - before;
}

// `base` is from `lingeringBase`, for a rebuild while read changes are still on screen.
function showReviewDiff({ base = null } = {}) {
  keepReadingSpot(() => buildReviewDiff(base));
}

// The text the open diff started from, with only the read changes that already left taken in:
// a rebuild against it keeps read changes still on screen dimmed in place, instead of pulling the text up under the reader.
function lingeringBase() {
  const diff = reviewDiff;
  if (!diff?.pieces.some(({ seen, gone }) => seen && !gone)) return null;
  return reviewWithSeen(diff.before, diff.after, diff.changes, new Set(diff.pieces.flatMap(({ gone }, i) => (gone ? [i] : []))));
}

function buildReviewDiff(lingering) {
  clearReviewDiff();
  const reviewed = doc?.reviewed;
  const after = editor.value;
  if (!doc?.stateLoaded || doc.conflict || changesOpen() || $("note").hidden || reviewed === null || reviewed === undefined) return;
  if (lastInline?.reviewed !== reviewed || lastInline.after !== after || lastInline.lingering !== lingering) {
    lastInline = { reviewed, after, lingering, ...rebuiltChanges(reviewed, after, lingering) };
  }
  const { before, changes, read } = lastInline;
  if (!changes.length) return;
  const pieces = changes.map((change) => ({
    change,
    dels: change.removed.map(({ at, text }) => {
      const el = document.createElement("del");
      el.className = "review";
      el.textContent = text;
      const spot = document.createRange();
      spot.setStart(...textPoint(at));
      spot.insertNode(el);
      return el;
    }),
    ranges: [],
    track: { since: null, covered: [] },
    seen: false,
    gone: false,
  }));
  // Only once all struck-out text is in, so no highlight starts in front of it.
  for (const piece of pieces) {
    piece.ranges = piece.change.added.map(({ start, end }) => {
      const range = document.createRange();
      range.setStart(...textPoint(start, { start: true }));
      range.setEnd(...textPoint(end));
      return range;
    });
  }
  for (const index of read) {
    pieces[index].seen = true;
    for (const el of pieces[index].dels) el.classList.add("seen");
  }
  const highlight = window.Highlight ? new Highlight(...pieces.flatMap((piece) => (piece.seen ? [] : piece.ranges))) : null;
  const fading = window.Highlight ? new Highlight(...pieces.flatMap((piece) => (piece.seen ? piece.ranges : []))) : null;
  if (highlight) {
    CSS.highlights.set("review-added", highlight);
    CSS.highlights.set("review-fading", fading);
  }
  $("note-sheet").classList.add("reviewing");
  reviewDiff = { before, after, changes, pieces, highlight, fading, reviewed, seen: new Set(read), timer: setInterval(checkSeen, SEEN_CHECK_MS) };
  placePieces(reviewDiff);
}

// Where each piece sits in the note, so each check only measures the pieces near the screen.
function placePieces(diff) {
  const offset = $("note").scrollTop - $("note").getBoundingClientRect().top;
  for (const piece of diff.pieces) {
    const box = piece.gone ? null : pieceBox(piece);
    piece.place = box && { top: box.top + offset, bottom: box.bottom + offset };
  }
}

function pieceBox(piece) {
  const boxes = [...piece.dels.map((el) => el.getBoundingClientRect()), ...piece.ranges.map((range) => range.getBoundingClientRect())]
    .filter((box) => box.width || box.height);
  if (!boxes.length) return null;
  const top = Math.min(...boxes.map((box) => box.top));
  return { top, bottom: Math.max(top + 1, ...boxes.map((box) => box.bottom)) };
}

// Struck-out text can sit in front of a line's own text, inside the same block.
function lineTextTop(line) {
  const spot = document.createRange();
  spot.setStart(...textPoint(lineStart(line), { start: true }));
  const box = spot.getBoundingClientRect();
  return box.height ? box.top - $("note").getBoundingClientRect().top + $("note").scrollTop : lineEls[line].offsetTop;
}

// Where a row of the list sits in the note, with the diff showing there.
function rowTopInNote({ kind, line }, nth) {
  const index = Math.min(line, lineEls.length) - 1;
  const piece = kind === "removed" ? reviewDiff?.pieces.find(({ change }) => change.newFrom === line - 1) : null;
  // Removed lines struck out whole sit together in one piece of struck-out text.
  const whole = piece ? piece.dels.findIndex((el) => el.textContent.includes("\n")) : -1;
  const struck = piece?.dels[whole]?.firstChild;
  const range = document.createRange();
  if (struck) {
    // Lines removed at the end are struck out after a line break; elsewhere a leading break is a removed blank line.
    const starts = [0, ...[...struck.data.matchAll(/\n/g)].map((match) => match.index + 1)].slice(piece.change.removed[whole].end ? 1 : 0);
    const at = starts[Math.min(nth, starts.length - 1)];
    // A blank last line has nothing to measure, so it starts where the line break before it ends.
    if (at === struck.length && at > 0) {
      range.setStart(struck, at - 1);
      range.setEnd(struck, at);
      return range.getBoundingClientRect().bottom;
    }
    range.setStart(struck, at);
  } else {
    // A removed line shown word by word is inside the line that replaced it.
    const target = Math.min(index + (kind === "removed" ? nth : 0), lineEls.length - 1);
    range.setStart(...textPoint(lineStart(target), { start: true }));
  }
  const box = range.getBoundingClientRect();
  return box.height ? box.top : lineEls[index].getBoundingClientRect().top;
}

// The reader's eyes are on that row of the list, so the note opens with the same line at the same height on screen.
// The caret stays put: focusing the note would end the diff.
function showRowInNote(row, nth, screenTop) {
  closeChanges();
  cancelAnimationFrame(flight);
  const note = $("note");
  const view = note.getBoundingClientRect();
  const target = screenTop > view.top && screenTop < view.bottom ? screenTop : view.top + note.clientHeight / 3;
  note.scrollTop += rowTopInNote(row, nth) - target;
  const line = Math.min(row.line, lineEls.length) - 1;
  editor.setSelectionRange(lineStart(line), lineStart(line));
  $("changes-open").focus({ preventScroll: true });
}

function revealFirstChange() {
  const box = reviewDiff?.pieces.map(pieceBox).find(Boolean);
  if (!box) return;
  const note = $("note");
  const view = note.getBoundingClientRect();
  const { top, bottom } = box;
  if (top < view.top || bottom > view.bottom) note.scrollTop += top - view.top - note.clientHeight / 3;
}

function checkSeen() {
  if (!doc || $("edit-screen").hidden) {
    clearReviewDiff();
    return;
  }
  const diff = reviewDiff;
  const now = performance.now();
  const view = $("note").getBoundingClientRect();
  const looking = !document.hidden && document.hasFocus() && !$("toc").open;
  const note = $("note");
  const nearFrom = note.scrollTop - note.clientHeight;
  const nearTo = note.scrollTop + 2 * note.clientHeight;
  // A phone throttles timers in the background, so a long gap since the last check is a break in looking.
  const resumed = now - (diff.checkedAt ?? now) > 3 * SEEN_CHECK_MS;
  diff.checkedAt = now;
  let dropped = false;
  for (const [index, piece] of diff.pieces.entries()) {
    if (piece.gone) continue;
    const far = piece.place && (piece.place.bottom < nearFrom || piece.place.top > nearTo);
    if ((far || resumed) && !piece.seen) piece.track = { ...piece.track, since: null };
    if (far && !piece.seen) continue;
    const box = far ? null : pieceBox(piece);
    if (piece.seen) {
      if (!box || box.bottom <= view.top || box.top >= view.bottom) {
        dropReadPiece(diff, piece);
        dropped = true;
      }
      continue;
    }
    // Only blank lines changed, which there is nothing to read in.
    if (box) piece.track = lookAt(piece.track, { ...box, viewTop: view.top, viewBottom: view.bottom, now, looking }, readingTime(piece.change.words));
    if (!box || piece.track.seen) markSeen(diff, index);
    if (reviewDiff !== diff) return;
  }
  if (diff.pieces.every(({ gone }) => gone)) clearReviewDiff();
  else if (dropped) placePieces(diff);
}

function markSeen(diff, index) {
  // Another device reviewed meanwhile, so what was shown no longer matches what is left to see.
  if (doc.reviewed !== diff.reviewed) {
    showReviewDiff({ base: lingeringBase() });
    return;
  }
  const piece = diff.pieces[index];
  piece.seen = true;
  diff.seen.add(index);
  diff.reviewed = doc.reviewed = reviewWithSeen(diff.before, diff.after, diff.changes, diff.seen);
  doc.reviewConfirmed = true;
  scheduleState(doc);
  showChangesHint();
  for (const el of piece.dels) el.classList.add("seen");
  for (const range of piece.ranges) {
    diff.highlight?.delete(range);
    diff.fading?.add(range);
  }
}

// A read change leaves only once it is off screen, since struck-out text going away moves the lines after it.
function dropReadPiece(diff, piece) {
  piece.gone = true;
  keepReadingSpot(() => removeStruck(piece.dels));
  for (const range of piece.ranges) diff.fading?.delete(range);
}

function offsetAtPoint(x, y) {
  const caret = document.caretPositionFromPoint?.(x, y);
  const range = caret ? null : document.caretRangeFromPoint?.(x, y);
  const node = caret?.offsetNode ?? range?.startContainer;
  const offset = caret?.offset ?? range?.startOffset ?? 0;
  if (!node) return null;
  const line = (node.nodeType === Node.TEXT_NODE ? node.parentElement : node).closest("#painted > div");
  const index = lineEls.indexOf(line);
  if (index === -1) return null;
  const children = [...line.childNodes];
  // Inside struck-out text the caret goes where that text was.
  const stop = node === line ? offset : children.findIndex((child) => child === node || child.contains(node));
  const column = children.slice(0, stop).reduce((sum, child) => sum + (child.nodeType === Node.TEXT_NODE ? child.length : 0), 0);
  return lineStart(index) + column + (node.parentNode === line && node.nodeType === Node.TEXT_NODE ? offset : 0);
}

// Struck-out text going away moves the lines below it, so the spot the reader is at stays where it is on screen.
function clearReviewDiffAt(offset) {
  if (!reviewDiff) return;
  const topOf = () => {
    const spot = document.createRange();
    spot.setStart(...textPoint(offset, { start: true }));
    spot.setEnd(...textPoint(Math.min(offset + 1, paintedText.length)));
    return spot.getClientRects()[0]?.top ?? lineEls[lineAndColumn(offset).line].getBoundingClientRect().top;
  };
  const before = topOf();
  clearReviewDiff();
  $("note").scrollTop += topOf() - before;
}

// Only places that put the caret in the note end the diff: the browser also focuses the note again when its window comes back.
function focusEditor() {
  clearReviewDiffAt(editor.selectionStart);
  editor.focus({ preventScroll: true });
}

new ResizeObserver(() => {
  if (reviewDiff) placePieces(reviewDiff);
}).observe($("painted"));

$("painted").addEventListener("click", (event) => {
  if (!reviewDiff) return;
  const below = event.clientY > lineEls.at(-1).getBoundingClientRect().bottom;
  const offset = offsetAtPoint(event.clientX, event.clientY) ?? (below ? editor.value.length : null);
  if (offset !== null) editor.setSelectionRange(offset, offset);
  focusEditor();
});
editor.addEventListener("beforeinput", () => clearReviewDiffAt(editor.selectionStart));

// Capture runs before the editor's own Ctrl+Z handler, which would otherwise have its new diff cleared straight away.
// Undo's own diff hides the unread changes, which come back with the next scroll once it is dismissed.
let reviewAfterStep = false;

function endStepDiff() {
  if (stepDiffRemoved || CSS.highlights?.has("just-added")) reviewAfterStep = true;
  clearStepDiff();
}
document.addEventListener("pointerdown", endStepDiff, { capture: true, passive: true });
document.addEventListener("wheel", endStepDiff, { capture: true, passive: true });
$("note").addEventListener("scroll", () => {
  if (!reviewAfterStep || stepDiffRemoved || CSS.highlights?.has("just-added")) return;
  reviewAfterStep = false;
  if (!reviewDiff && doc && hasChanges(doc) && document.activeElement !== editor) showReviewDiff();
}, { passive: true });
document.addEventListener("keydown", (event) => {
  if (!["Control", "Shift", "Alt", "Meta"].includes(event.key)) clearStepDiff();
}, { capture: true });

function applyHistoryStep(step) {
  if (!doc?.history) return;
  const change = step(doc.history);
  if (!change) return;
  const textBefore = paintedText;
  const removed = textBefore.slice(change.start, change.end);
  editor.setRangeText(change.text, change.start, change.end, "end");
  editor.setSelectionRange(change.caret, change.caret);
  noteChanged();
  if (change.keepsReview) showChangesHint();
  else if (!change.fromPc) followOwnEdit(textBefore);
  else if (doc.reviewed !== null) {
    doc.reviewed = undoIntoReview(doc.reviewed, textBefore, editor.value);
    showChangesHint();
  }
  showUndoButtons(doc.history);
  doc.stateDirty = true;
  pushState(doc);
  if (changesOpen()) return;
  showStepDiff(change.start, change.caret, removed);
  // The change may be far from where the reader is, and it has to be seen to be trusted.
  const note = $("note");
  const el = lineEls[editor.value.slice(0, change.start).split("\n").length - 1];
  const onScreen = el.offsetTop >= note.scrollTop && el.offsetTop < note.scrollTop + note.clientHeight - el.offsetHeight;
  if (!onScreen) flyTo(el.offsetTop - note.clientHeight / 3);
}

for (const [id, step] of [["undo", undo], ["redo", redo]]) {
  $(id).addEventListener("click", () => applyHistoryStep(step));
}
for (const id of ["undo", "redo", "mark-pill"]) {
  // Keeping focus in the note keeps the phone's keyboard open.
  $(id).addEventListener("mousedown", (event) => event.preventDefault());
}

// The browser's own history is wiped by this page's text updates, and then it stops announcing undo and redo at all.
editor.addEventListener("keydown", (event) => {
  if (!event.ctrlKey && !event.metaKey) return;
  const key = event.key.toLowerCase();
  const isRedo = key === "y" || (key === "z" && event.shiftKey);
  if (key !== "z" && !isRedo) return;
  event.preventDefault();
  applyHistoryStep(isRedo ? redo : undo);
});
editor.addEventListener("beforeinput", (event) => {
  if (event.inputType !== "historyUndo" && event.inputType !== "historyRedo") return;
  event.preventDefault();
  applyHistoryStep(event.inputType === "historyUndo" ? undo : redo);
});

// ---- Marks ----

let markedEls = [];
// Diffs and search look up thousands of offsets in a long note, so the line starts are kept until the text changes.
let lineStarts = null;

function startsOfLines() {
  if (lineStarts) return lineStarts;
  lineStarts = [];
  let at = 0;
  for (const text of paintedLines) {
    lineStarts.push(at);
    at += text.length + 1;
  }
  return lineStarts;
}

const lineStart = (line) => startsOfLines()[line] ?? paintedText.length + 1;

function lineAndColumn(offset) {
  const starts = startsOfLines();
  let low = 0;
  let high = starts.length - 1;
  while (low < high) {
    const middle = Math.ceil((low + high) / 2);
    if (starts[middle] <= offset) low = middle;
    else high = middle - 1;
  }
  return { line: low, column: offset - (starts[low] ?? 0) };
}

function buildSpot(column) {
  const spot = document.createElement("span");
  spot.className = "spot";
  if (column !== undefined) spot.dataset.column = column;
  return spot;
}

// Only lines whose marks changed are rebuilt, because this runs on every keystroke while a note has marks.
function showMarksInNote(current) {
  if (stepDiffRemoved) clearStepDiff();
  // A line is rebuilt from its text, which would take in any struck-out text inside it.
  let reviewing = false;
  let base = null;
  const stopReviewing = () => {
    if (!reviewDiff) return;
    reviewing = true;
    base = lingeringBase();
    keepReadingSpot(clearReviewDiff);
  };
  const columnsByEl = new Map();
  for (const { offset } of current.marks) {
    const { line, column } = lineAndColumn(offset);
    const el = lineEls[line];
    columnsByEl.set(el, [...(columnsByEl.get(el) ?? []), column]);
  }
  for (const el of markedEls) {
    if (columnsByEl.has(el)) continue;
    stopReviewing();
    el.textContent = el.textContent;
    delete el.dataset.columns;
    refreshSearchSoon();
  }
  for (const [el, columns] of columnsByEl) {
    const key = columns.join();
    if (el.dataset.columns === key) continue;
    stopReviewing();
    const text = el.textContent;
    const nodes = [];
    let at = 0;
    for (const column of columns) {
      nodes.push(text.slice(at, column), buildSpot(column));
      at = column;
    }
    nodes.push(text.slice(at));
    el.replaceChildren(...nodes);
    el.dataset.columns = key;
    refreshSearchSoon();
  }
  markedEls = [...columnsByEl.keys()];
  if (reviewing) showReviewDiff({ base });
}

function rememberRemoved(current, offset) {
  const known = [...current.marks, ...(current.synced?.remote.marks ?? [])];
  // The server's offsets are for the text it last saw, so each is placed in this text before comparing.
  const here = known.filter((mark) => relocate([mark], editor.value)[0].offset === offset);
  current.removedMarks = [...current.removedMarks, ...here.map(markId)];
}

function setMarks(current, marks, { share = true } = {}) {
  current.marks = marks;
  showMarksInNote(current);
  if (share) scheduleState(current);
}

// ---- Mark button that floats at the cursor, like the phone's own Cut and Copy menu ----

let pillTimer = 0;
let lastEditAt = 0;
let toastTimer = 0;

function showToast(text) {
  const toast = $("toast");
  clearTimeout(toastTimer);
  toast.textContent = text;
  // Showing it again puts it above an open sheet.
  if (toast.matches(":popover-open")) toast.hidePopover();
  toast.showPopover();
  toastTimer = setTimeout(() => toast.hidePopover(), TOAST_MS);
}

function hideMarkPill() {
  clearTimeout(pillTimer);
  $("mark-pill").hidden = true;
}

function caretBox(offset) {
  const { line, column } = lineAndColumn(offset);
  const el = lineEls[line];
  let left = column;
  for (const node of el.childNodes) {
    if (node.nodeType !== Node.TEXT_NODE) continue;
    if (left <= node.length) {
      const range = document.createRange();
      range.setStart(node, left);
      range.setEnd(node, Math.min(left + 1, node.length));
      const box = range.getClientRects()[0];
      if (box) return box;
    }
    left -= node.length;
  }
  return el.getBoundingClientRect();
}

function showMarkPill() {
  const pill = $("mark-pill");
  if (!doc?.history || document.activeElement !== editor || composing || $("toc").open) {
    hideMarkPill();
    return;
  }
  const offset = editor.selectionStart;
  const isRange = editor.selectionEnd !== offset;
  pill.textContent = doc.marks.some((mark) => mark.offset === offset) ? "Remove mark" : "Mark";
  pill.hidden = false;
  const sheet = $("note-sheet").getBoundingClientRect();
  const note = $("note").getBoundingClientRect();
  const start = caretBox(offset);
  const below = caretBox(editor.selectionEnd).bottom + PILL_GAP_PX;
  const above = start.top - pill.offsetHeight - PILL_GAP_PX;
  // The phone's own menu sits above a selection, so a selection gets the button below it.
  const top = isRange || above < note.top ? below : above;
  if (top < note.top || top > note.bottom) {
    hideMarkPill();
    return;
  }
  const half = pill.offsetWidth / 2;
  const center = Math.max(half + PILL_GAP_PX, Math.min(start.left - sheet.left, sheet.width - half - PILL_GAP_PX));
  pill.style.insetBlockStart = `${top - sheet.top}px`;
  pill.style.insetInlineStart = `${center - half}px`;
}

document.addEventListener("selectionchange", () => {
  if (document.activeElement !== editor) return;
  clearTimeout(pillTimer);
  // The cursor moving because of typing isn't a request to mark anything.
  if (Date.now() - lastEditAt < 300) {
    hideMarkPill();
    return;
  }
  pillTimer = setTimeout(showMarkPill, PILL_DELAY_MS);
});
editor.addEventListener("blur", hideMarkPill);

// Pressing it on a marked spot removes the mark, so a wrong tap undoes itself.
$("mark-pill").addEventListener("click", () => {
  const offset = editor.selectionStart;
  const others = doc.marks.filter((mark) => mark.offset !== offset);
  const adding = others.length === doc.marks.length;
  if (!adding) rememberRemoved(doc, offset);
  setMarks(doc, relocate(adding ? [...others, createMark(editor.value, offset)] : others, editor.value));
  hideMarkPill();
  showToast(adding ? "Mark added" : "Mark removed");
});

function goToMark(offset) {
  closeReading({ remember: false });
  closeChanges();
  editor.setSelectionRange(offset, offset);
  // Focusing the note on a phone would pop the keyboard over what the reader came to see.
  if (matchMedia("(pointer: fine)").matches) focusEditor();
  const { line, column } = lineAndColumn(offset);
  const spot = lineEls[line].querySelector(`[data-column="${column}"]`);
  flyTo((spot ? spot.offsetTop : lineTextTop(line)) - $("note").clientHeight / 3);
}

function buildMarkRow({ offset, before, after }) {
  const row = document.createElement("li");
  const go = document.createElement("button");
  go.type = "button";
  go.className = "mark-go";
  const { line } = lineAndColumn(offset);
  const lead = before.split("\n").at(-1).slice(-20);
  const rest = after.split("\n")[0].slice(0, 28);
  const preview = document.createElement("span");
  if (lead.trim() || rest.trim()) preview.append(lead, buildSpot(), rest);
  else preview.textContent = "Blank line";
  const where = document.createElement("small");
  const heading = paintedHeadings.findLast((candidate) => candidate.offset <= offset);
  where.textContent = heading ? `Line ${line + 1} · ${heading.title}` : `Line ${line + 1}`;
  go.append(preview, where);
  go.addEventListener("click", () => {
    $("toc").close();
    goToMark(offset);
  });
  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "mark-remove";
  remove.setAttribute("aria-label", `Remove mark on line ${line + 1}`);
  remove.append(icon("#i-x", ""));
  remove.addEventListener("click", () => {
    rememberRemoved(doc, offset);
    setMarks(doc, doc.marks.filter((mark) => mark.offset !== offset));
    renderMarkRows();
    showToast("Mark removed");
    $("tab-marks").focus();
  });
  row.append(go, remove);
  return row;
}

function renderMarkRows() {
  $("marks-list").replaceChildren(...doc.marks.map(buildMarkRow));
  $("marks-empty").hidden = doc.marks.length > 0;
  $("tab-marks").textContent = doc.marks.length ? `Marks ${doc.marks.length}` : "Marks";
}

function showSheetView(view) {
  for (const name of ["contents", "marks"]) {
    $(`view-${name}`).hidden = name !== view;
    $(`tab-${name}`).setAttribute("aria-pressed", String(name === view));
  }
  $("toc").scrollTop = 0;
  if (view === "contents") $("toc-list").querySelector("[aria-current]")?.scrollIntoView({ block: "center" });
}

$("tab-contents").addEventListener("click", () => showSheetView("contents"));
$("tab-marks").addEventListener("click", () => showSheetView("marks"));

function buildCount(iconName, amount, label) {
  const count = document.createElement("span");
  count.className = "count";
  const shown = document.createElement("span");
  shown.setAttribute("aria-hidden", "true");
  shown.textContent = amount;
  const spoken = document.createElement("span");
  spoken.className = "for-screen-readers";
  spoken.textContent = `${label}: ${amount}`;
  count.append(icon(iconName, ""), shown, spoken);
  return count;
}

function goToLine(line) {
  closeReading({ remember: false });
  closeChanges();
  // Focusing the note on a phone would pop the keyboard over what the reader came to see.
  if (matchMedia("(pointer: fine)").matches) {
    const offset = paintedLines.slice(0, line).reduce((sum, text) => sum + text.length + 1, 0);
    editor.setSelectionRange(offset, offset);
    focusEditor();
  }
  flyTo(lineTextTop(line) - JUMP_GAP_PX);
}

// ---- Contents ----

function openContents(view = "contents") {
  renderMarkRows();
  const markCounts = countPerHeading(paintedHeadings, doc.marks);
  const headings = paintedHeadings;
  const top = $("note").scrollTop + JUMP_GAP_PX + 1;
  const currentAt = headings.findLastIndex(({ el }) => el.offsetTop <= top);
  const shallowest = Math.min(...headings.map(({ level }) => level));
  $("toc-list").replaceChildren(...headings.map((heading, index) => {
    const row = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    button.className = `h${heading.level}`;
    button.style.setProperty("--depth", Math.min(heading.level - shallowest, 3));
    button.classList.add("heading-row");
    const title = document.createElement("span");
    title.textContent = heading.title;
    button.append(title);
    if (heading.bullets || markCounts[index]) {
      const counts = document.createElement("span");
      counts.className = "counts";
      if (heading.bullets) counts.append(buildCount("#i-toc", heading.bullets, "Bullet points"));
      if (markCounts[index]) counts.append(buildCount("#i-bookmark", markCounts[index], "Marks"));
      button.append(counts);
    }
    if (index === currentAt) button.setAttribute("aria-current", "location");
    button.addEventListener("click", () => jumpTo(heading));
    row.append(button);
    return row;
  }));
  $("toc-empty").hidden = headings.length > 0;
  $("toc-list").hidden = headings.length === 0;
  $("toc").showModal();
  $("toc-list").querySelector("[aria-current]")?.focus({ preventScroll: true });
  showSheetView(view);
}

function jumpTo({ line }) {
  $("toc").close();
  goToLine(line);
}

let flight = 0;

// Same short flight at any distance: a far target starts one screen away, so the slide only shows the direction.
function flyTo(target) {
  closeChanges();
  const note = $("note");
  cancelAnimationFrame(flight);
  const end = Math.max(0, Math.min(target, note.scrollHeight - note.clientHeight));
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    note.scrollTop = end;
    return;
  }
  const start = Math.max(end - note.clientHeight, Math.min(note.scrollTop, end + note.clientHeight));
  const startedAt = performance.now();
  note.scrollTop = start;
  const step = (now) => {
    const t = Math.min(1, (now - startedAt) / FLY_MS);
    note.scrollTop = start + (end - start) * (1 - (1 - t) ** 3);
    if (t < 1) flight = requestAnimationFrame(step);
  };
  flight = requestAnimationFrame(step);
}

for (const type of ["pointerdown", "wheel"]) {
  $("note").addEventListener(type, () => cancelAnimationFrame(flight), { passive: true });
}

$("toc-open").addEventListener("click", () => openContents());
$("marks-open").addEventListener("click", () => openContents("marks"));
$("go-top").addEventListener("click", () => {
  $("toc").close();
  flyTo(0);
});
$("go-bottom").addEventListener("click", () => {
  $("toc").close();
  closeChanges();
  const note = $("note");
  const blankBelowText = parseFloat(getComputedStyle(editor).paddingBlockEnd);
  flyTo(note.scrollHeight - blankBelowText + END_GAP_PX - note.clientHeight);
});

// ---- Find in this note. The matches are painted as highlights, so no line's text or the file is ever touched ----

let searchMatches = [];
let searchIndex = -1;
let searchTimer = 0;
let focusEditorAfterSearch = false;
const searchIsOpen = () => !$("search-bar").hidden;

// Matches come sorted, so one walk through the lines finds them all, instead of a walk per match.
function buildMatchRanges(matches) {
  let line = 0;
  let start = 0;
  const pointAt = (offset, isStart = false) => {
    while (line < paintedLines.length - 1 && offset > start + paintedLines[line].length) {
      start += paintedLines[line].length + 1;
      line++;
    }
    return pointInLine(line, offset - start, isStart);
  };
  return matches.map((match) => {
    const range = document.createRange();
    range.setStart(...pointAt(match.start, true));
    range.setEnd(...pointAt(match.end));
    return range;
  });
}

function clearSearchPaint() {
  CSS.highlights?.delete("search-match");
  CSS.highlights?.delete("search-current");
}

function showSearchState() {
  const count = searchMatches.length;
  const empty = !$("search-input").value;
  $("search-count").textContent = empty ? "" : count ? `${searchIndex + 1}/${count}` : "No results";
  $("search-previous").disabled = count === 0;
  $("search-next").disabled = count === 0;
  clearSearchPaint();
  if (!count || !window.Highlight) return;
  // Very common words can match thousands of times, and only those near the current one can be on screen.
  const nearby = searchMatches.slice(Math.max(0, searchIndex - MAX_PAINTED_MATCHES), searchIndex + MAX_PAINTED_MATCHES);
  CSS.highlights.set("search-match", new Highlight(...buildMatchRanges(nearby)));
  const current = new Highlight(...buildMatchRanges([searchMatches[searchIndex]]));
  current.priority = 1;
  CSS.highlights.set("search-current", current);
}

function revealCurrentMatch() {
  const match = searchMatches[searchIndex];
  if (!match) return;
  const [range] = buildMatchRanges([match]);
  const note = $("note");
  const box = note.getBoundingClientRect();
  const spot = range.getBoundingClientRect();
  cancelAnimationFrame(flight);
  if (spot.top < box.top || spot.bottom > box.bottom) note.scrollTop += spot.top - box.top - note.clientHeight / 3;
}

function runSearch({ keepPlace = false } = {}) {
  clearTimeout(searchTimer);
  searchTimer = 0;
  const before = keepPlace ? searchMatches[searchIndex]?.start ?? 0 : null;
  searchMatches = findMatches(editor.value, $("search-input").value);
  const from = before ?? lineStart(topVisibleLine());
  const next = searchMatches.findIndex((match) => match.start >= from);
  searchIndex = searchMatches.length ? Math.max(next, 0) : -1;
  showSearchState();
  if (!keepPlace) revealCurrentMatch();
}

function moveSearch(step) {
  if (searchTimer) runSearch({ keepPlace: true });
  const count = searchMatches.length;
  if (!count) return;
  searchIndex = (searchIndex + step + count) % count;
  showSearchState();
  revealCurrentMatch();
}

// Editing and repainting replace the text the highlights point at.
function refreshSearchSoon() {
  if (!searchIsOpen()) return;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch({ keepPlace: true }), document.activeElement === editor ? SEARCH_WHILE_TYPING_MS : SEARCH_DELAY_MS);
}

// ---- Reading view: the note as formatted Markdown. Its renderer loads the first time it is opened ----

let renderNote = null;
let readingTimer = 0;
const readingOpen = () => !$("read-view").hidden;
const readingPreferred = () => {
  try {
    return localStorage.getItem(READ_MODE_KEY) === "1";
  } catch {
    return false;
  }
};

function rememberReading(on) {
  try {
    localStorage.setItem(READ_MODE_KEY, on ? "1" : "0");
  } catch {}
}

async function openReading() {
  const current = doc;
  if (readingOpen() || !current?.history) return;
  renderNote ??= (await import("/reading.js")).renderNote;
  if (doc !== current || readingOpen()) return;
  const line = topVisibleLine();
  closeSearch({ moveFocus: false });
  hideMarkPill();
  clearReviewDiff();
  $("read-view").innerHTML = renderNote(editor.value);
  $("note").hidden = true;
  $("read-view").hidden = false;
  $("read-toggle").setAttribute("aria-pressed", "true");
  const block = [...$("read-view").querySelectorAll("[data-line]")].findLast((el) => Number(el.dataset.line) <= line);
  $("read-view").scrollTop = block ? block.offsetTop - JUMP_GAP_PX : 0;
}

// `remember: false` when something else needs the editor for a moment, like search or a jump.
function closeReading({ remember = true } = {}) {
  if (!readingOpen()) return;
  clearTimeout(readingTimer);
  const view = $("read-view");
  const block = [...view.querySelectorAll("[data-line]")].find((el) => el.offsetTop + el.offsetHeight > view.scrollTop);
  view.hidden = true;
  view.replaceChildren();
  $("note").hidden = false;
  $("read-toggle").setAttribute("aria-pressed", "false");
  if (block) $("note").scrollTop = lineTextTop(Math.min(Number(block.dataset.line), lineEls.length - 1)) - JUMP_GAP_PX;
  if (remember) rememberReading(false);
  showReviewDiff();
}

// The AI may write while the note is being read; its new text shows after a moment, in the same place.
function refreshReadingSoon() {
  if (!readingOpen() || !renderNote) return;
  clearTimeout(readingTimer);
  readingTimer = setTimeout(() => {
    if (!readingOpen()) return;
    const top = $("read-view").scrollTop;
    $("read-view").innerHTML = renderNote(editor.value);
    $("read-view").scrollTop = top;
  }, SEARCH_DELAY_MS);
}

$("read-toggle").addEventListener("click", () => {
  if (readingOpen()) closeReading();
  else {
    rememberReading(true);
    openReading();
  }
});

function openSearch() {
  if (!doc?.history) return;
  closeReading({ remember: false });
  closeChanges();
  hideMarkPill();
