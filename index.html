<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#100F0F">
<title>MD Phone</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #100F0F;
    --text: #CECDC3;
    --muted: #878580;
    --line: #282726;
    --pressed: #1C1B1A;
    --accent: #3AA99F;
    --on-accent: #100F0F;
    --selection: #164F4A;
    --warn: #E8705F;
    --warn-bg: #301A12;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.5 system-ui, sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: var(--selection); }
  [hidden] { display: none !important; }
  svg { display: block; width: 20px; height: 20px; flex: none; }
  .icon {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .screen { height: 100dvh; display: flex; flex-direction: column; }
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 52px;
    padding-block: 4px;
    padding-inline: 4px 16px;
    border-block-end: 1px solid var(--line);
  }
  #list-screen header { padding-inline-end: 4px; }
  #list-screen h1 { padding-inline-start: 12px; }
  #list-back:not([hidden]) + h1 { padding-inline-start: 0; }
  h1 {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  h1:focus { outline: none; }
  .back {
    flex: none;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    color: var(--accent);
    border-radius: 8px;
  }
  .back svg { width: 24px; height: 24px; margin-inline-start: -2px; }
  #status { flex: none; font-size: 0.875rem; color: var(--muted); }
  #status[data-tone="warn"] { color: var(--warn); font-weight: 600; }

  button {
    min-height: 44px;
    padding-inline: 16px;
    font: inherit;
    font-size: 0.9375rem;
    font-weight: 600;
    white-space: nowrap;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--muted);
    border-radius: 8px;
  }
  button:disabled { opacity: 0.6; }
  #new-file { flex: none; color: var(--accent); border-color: transparent; padding-inline: 12px; }
  #new-create { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }

  #new-form {
    flex: none;
    padding: 12px 16px 16px;
    border-block-end: 1px solid var(--line);
  }
  #new-form label { display: block; margin-block-end: 4px; font-size: 0.875rem; color: var(--muted); }
  .new-row { display: flex; gap: 8px; }
  #new-name {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    padding-inline: 12px;
    font: inherit;
    color: inherit;
    caret-color: var(--accent);
    background: transparent;
    border: 1px solid var(--muted);
    border-radius: 8px;
  }
  #new-name::placeholder { color: var(--muted); opacity: 1; }
  #new-error { margin-block: 8px 0; font-size: 0.875rem; color: var(--warn); }

  #list-body { flex: 1; min-height: 0; overflow-y: auto; padding-block-end: 24px; }
  .rows { margin: 0; padding-block: 4px; padding-inline: 0; list-style: none; }
  .rows li { position: relative; display: flex; align-items: center; background: var(--bg); }
  .rows a {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 48px;
    padding-block: 10px;
    padding-inline: 16px;
    color: inherit;
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .rows a span { flex: 1; min-width: 0; }
  .rows small { display: block; font-size: 0.875rem; line-height: 1.35; color: var(--muted); }
  .rows .kind { color: var(--muted); }
  .rows .is-file .kind { color: var(--accent); }
  .rows .chevron { color: var(--muted); width: 16px; height: 16px; }
  .pin {
    flex: none;
    align-self: stretch;
    display: grid;
    place-items: center;
    width: 52px;
    min-height: 48px;
    padding: 0;
    color: var(--muted);
    border: 0;
    border-radius: 0;
  }
  .pin[aria-pressed="true"] { color: var(--accent); }
  .pin[aria-pressed="true"] svg { fill: currentColor; }
  #pinned-section h2 {
    margin: 0;
    padding-block: 20px 4px;
    padding-inline: 16px;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--muted);
  }
  .message { margin: 0; padding: 24px 16px; color: var(--muted); }
  .back:active, .rows a:active, .pin:active, #new-file:active { background: var(--pressed); }

  #conflict {
    flex: none;
    padding: 12px 16px;
    background: var(--warn-bg);
    border-block-end: 1px solid var(--line);
  }
  #conflict p { margin: 0 0 12px; font-size: 0.9375rem; }
  #conflict strong { display: block; font-weight: 600; }
  #conflict div { display: flex; flex-wrap: wrap; gap: 8px; }

  #editor {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 42rem;
    margin-inline: auto;
    padding-block: 20px 40vh;
    padding-inline: 16px;
    border: 0;
    outline: 0;
    resize: none;
    color: inherit;
    caret-color: var(--accent);
    background: transparent;
    font: 1.125rem/1.65 "Noto Serif", Georgia, serif;
    overscroll-behavior-y: contain;
  }

  @media (hover: hover) {
    .back:hover, .rows a:hover, .pin:hover, #new-file:hover { background: var(--pressed); }
  }
  @media (prefers-reduced-motion: no-preference) {
    button:not(:disabled), .back { transition: scale 150ms ease-out; }
    button:not(:disabled):active, .back:active { scale: 0.96; }
    #conflict, #new-form {
      transition: opacity 150ms ease-out, translate 150ms ease-out;
      @starting-style { opacity: 0; translate: 0 -4px; }
    }
  }
</style>
</head>
<body>
<svg hidden>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></symbol>
</svg>

<main id="list-screen" class="screen" hidden>
  <header>
    <a id="list-back" class="back" aria-label="Up one folder"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></a>
    <h1 id="list-title" tabindex="-1"></h1>
    <button id="new-file" type="button" aria-expanded="false" aria-controls="new-form" hidden>New file</button>
  </header>
  <form id="new-form" hidden novalidate>
    <label for="new-name">File name</label>
    <div class="new-row">
      <input id="new-name" name="filename" autocomplete="off" spellcheck="false" enterkeyhint="go" placeholder="notes.md" aria-describedby="new-error">
      <button id="new-create" type="submit">Create</button>
    </div>
    <p id="new-error" hidden></p>
  </form>
  <div id="list-body">
    <ul id="items" class="rows"></ul>
    <p id="message" class="message" role="status" hidden></p>
    <section id="pinned-section" aria-labelledby="pinned-heading" hidden>
      <h2 id="pinned-heading">Pinned</h2>
      <ul id="pinned" class="rows"></ul>
    </section>
  </div>
</main>

<main id="edit-screen" class="screen" hidden>
  <header>
    <a id="edit-back" class="back" aria-label="Back to folder"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></a>
    <h1 id="edit-title" tabindex="-1"></h1>
    <span id="status" role="status"></span>
  </header>
  <section id="conflict" role="alert" hidden>
    <p><strong>This file changed on the PC.</strong> Nothing was overwritten. Keep your text to replace the PC version, or use the PC version to discard your text.</p>
    <div>
      <button id="keep-mine" type="button">Keep my text</button>
      <button id="use-pc" type="button">Use PC version</button>
    </div>
  </section>
  <p id="edit-message" class="message" hidden></p>
  <textarea id="editor" aria-labelledby="edit-title" autocapitalize="sentences" spellcheck="false" disabled></textarea>
</main>

<script>
const SAVE_DELAY_MS = 800;
const DRAFT_DELAY_MS = 250;
const POLL_MS = 3000;
const OFFLINE_HELP = "Check that the PC is on and Tailscale is connected, then pull down to reload.";

const $ = (id) => document.getElementById(id);
const editor = $("editor");
const decoder = new TextDecoder("utf-8", { ignoreBOM: true });
let doc = null;
let folder = null;
let saveTimer = 0;
let draftTimer = 0;
let composing = false;

const hashFor = (root, parts) => "#/" + [root, ...parts].map(encodeURIComponent).join("/");
const parseHash = (hash) => hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
const apiQuery = (root, path) => `root=${encodeURIComponent(root)}&path=${encodeURIComponent(path)}`;

// shortcut: pins stay in this browser and go if its site data is cleared, move them to a file on the PC if they must follow other devices.
let redrawFolder = null;
const pins = new Set(loadPins());

function loadPins() {
  try {
    const saved = JSON.parse(localStorage.getItem("pins"));
    return Array.isArray(saved) ? saved : [];
  } catch {
    return [];
  }
}

function togglePin(href) {
  const pinned = !pins.delete(href);
  if (pinned) pins.add(href);
  try { localStorage.setItem("pins", JSON.stringify([...pins])); } catch {}
  return pinned;
}

// Runs on every keystroke, so it must not touch the DOM when nothing changed.
function setStatus(text, tone = "") {
  const status = $("status");
  if (status.textContent !== text) status.textContent = text;
  if (status.dataset.tone !== tone) status.dataset.tone = tone;
}

function show(screen, title) {
  $("list-screen").hidden = screen !== "list";
  $("edit-screen").hidden = screen !== "edit";
  document.title = title;
  const heading = $(screen === "list" ? "list-title" : "edit-title");
  heading.textContent = title;
  heading.focus({ preventScroll: true });
}

// ---- Folder view ----

function icon(name, className) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", `icon ${className}`);
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", name);
  svg.append(use);
  return svg;
}

function buildRow({ href, label, isFile, hint }) {
  const row = document.createElement("li");
  row.dataset.key = href;
  const link = document.createElement("a");
  link.href = href;
  if (isFile) link.className = "is-file";
  const text = document.createElement("span");
  text.textContent = label;
  if (hint) {
    const where = document.createElement("small");
    where.textContent = hint;
    text.append(where);
  }
  link.append(icon(isFile ? "#i-file" : "#i-folder", "kind"), text);
  if (!isFile) link.append(icon("#i-next", "chevron"));
  row.append(link);
  if (isFile) row.append(buildPinButton(href, hint ? `${hint} / ${label}` : label));
  return row;
}

function buildPinButton(href, name) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "pin";
  button.setAttribute("aria-label", `Pin ${name}`);
  button.setAttribute("aria-pressed", String(pins.has(href)));
  button.append(icon("#i-pin", ""));
  button.addEventListener("click", () => {
    button.setAttribute("aria-pressed", String(togglePin(href)));
    if (redrawFolder) moveRows(redrawFolder, href);
  });
  return button;
}

function renderItems(links, emptyText) {
  $("items").replaceChildren(...links.map(buildRow));
  $("items").hidden = links.length === 0;
  $("message").hidden = links.length > 0;
  $("message").textContent = links.length ? "" : emptyText;
}

function renderPinned() {
  const rows = [...pins]
    .map((href) => {
      const [root, ...parts] = parseHash(href);
      return { href, isFile: true, label: parts.at(-1), hint: [root, ...parts.slice(0, -1)].join(" / ") };
    })
    .sort((a, b) => a.label.localeCompare(b.label) || a.hint.localeCompare(b.hint));
  $("pinned").replaceChildren(...rows.map(buildRow));
  $("pinned-section").hidden = rows.length === 0;
}

// Slides each row from its old place to its new one, so a pinned file visibly goes to the top.
function moveRows(redraw, movedKey) {
  const rows = () => [...$("items").children];
  const before = new Map(rows().map((row) => [row.dataset.key, row.getBoundingClientRect().top]));
  redraw();
  const moved = rows().find((row) => row.dataset.key === movedKey);
  moved?.querySelector(".pin").focus({ preventScroll: true });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (const row of rows()) {
    const top = row.getBoundingClientRect().top;
    const from = before.get(row.dataset.key);
    const onScreen = (y) => y > -row.offsetHeight && y < innerHeight;
    if (from === top || (!onScreen(from) && !onScreen(top))) continue;
    row.animate(
      { translate: [`0 ${from - top}px`, "0 0"], zIndex: row === moved ? [1, 1] : [0, 0] },
      { duration: 200, easing: "cubic-bezier(0.2, 0, 0, 1)" },
    );
  }
}

function closeNewForm() {
  $("new-form").hidden = true;
  $("new-file").setAttribute("aria-expanded", "false");
  $("new-file").textContent = "New file";
}

async function showRoots() {
  folder = null;
  redrawFolder = null;
  const openedAt = location.hash;
  show("list", "MD Phone");
  $("list-back").hidden = true;
  $("new-file").hidden = true;
  closeNewForm();
  renderItems([], "Opening…");
  renderPinned();
  try {
    const names = await (await fetch("/api/roots")).json();
    if (location.hash !== openedAt) return;
    renderItems(names.map((name) => ({ href: hashFor(name, []), label: name })), "No folders are set up. Add one to roots.json on the PC.");
  } catch {
    if (location.hash === openedAt) renderItems([], `Unable to reach the PC. ${OFFLINE_HELP}`);
  }
}

async function showFolder(root, parts) {
  redrawFolder = null;
  const openedAt = location.hash;
  show("list", parts.at(-1) ?? root);
  $("list-back").hidden = false;
  $("list-back").href = parts.length ? hashFor(root, parts.slice(0, -1)) : "#/";
  $("new-file").hidden = true;
  $("pinned-section").hidden = true;
  closeNewForm();
  folder = { root, parts };
  renderItems([], "Opening…");
  try {
    const res = await fetch(`/api/list?${apiQuery(root, parts.join("/"))}`);
    if (!res.ok) throw new Error(await res.text());
    const { dirs, files } = await res.json();
    if (location.hash !== openedAt) return;
    const hrefOf = (name) => hashFor(root, [...parts, name]);
    const fileRow = (name) => ({ href: hrefOf(name), label: name, isFile: true });
    redrawFolder = () => renderItems([
      ...files.filter((name) => pins.has(hrefOf(name))).map(fileRow),
      ...dirs.map((name) => ({ href: hrefOf(name), label: name })),
      ...files.filter((name) => !pins.has(hrefOf(name))).map(fileRow),
    ], "No markdown files here yet. Tap New file to add one.");
    $("new-file").hidden = false;
    redrawFolder();
  } catch {
    if (location.hash === openedAt) renderItems([], `Unable to open this folder. ${OFFLINE_HELP}`);
  }
}

$("new-file").addEventListener("click", () => {
  if (!$("new-form").hidden) {
    closeNewForm();
    return;
  }
  $("new-name").value = "";
  $("new-name").removeAttribute("aria-invalid");
  $("new-error").hidden = true;
  $("new-form").hidden = false;
  $("new-file").setAttribute("aria-expanded", "true");
  $("new-file").textContent = "Cancel";
  $("new-name").focus();
});

$("new-name").addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  closeNewForm();
  $("new-file").focus();
});

$("new-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const { root, parts } = folder;
  let problem;
  $("new-create").disabled = true;
  try {
    const query = `${apiQuery(root, parts.join("/"))}&name=${encodeURIComponent($("new-name").value)}`;
    const res = await fetch(`/api/create?${query}`, { method: "PUT" });
    if (res.ok) {
      const { name } = await res.json();
      location.hash = hashFor(root, [...parts, name]);
      return;
    }
    problem = await res.text();
  } catch {
    problem = "Unable to reach the PC. Check your connection and try again.";
  } finally {
    $("new-create").disabled = false;
  }
  $("new-error").textContent = problem;
  $("new-error").hidden = false;
  $("new-name").setAttribute("aria-invalid", "true");
  $("new-name").focus();
});

// ---- Draft kept on the phone, so a dropped connection or a killed tab loses nothing ----

function keepDraft(current) {
  clearTimeout(draftTimer);
  try {
    localStorage.setItem(current.draftKey, JSON.stringify({ text: editor.value, base: current.base }));
  } catch {}
}
function clearDraft(current) {
  clearTimeout(draftTimer);
  try { localStorage.removeItem(current.draftKey); } catch {}
}
function readDraft(current) {
  try { return JSON.parse(localStorage.getItem(current.draftKey)); } catch { return null; }
}
function flushDraft() {
  if (doc && doc.base !== null && isDirty(doc)) keepDraft(doc);
}

// ---- Editor ----

const isDirty = (current) => editor.value !== current.saved;
// A textarea always reports "\n", so a Windows file gets its "\r\n" back on save.
const toDisk = (current, text) => (current.crlf ? text.replace(/\n/g, "\r\n") : text);
const fromDisk = (text) => text.replace(/\r\n?/g, "\n");
const fetchFile = (current, headers = {}) => fetch(current.url, { cache: "no-store", headers });

function adoptVersion(current, raw, version) {
  current.base = version;
  current.crlf = raw.includes("\r\n");
  current.saved = fromDisk(raw);
}

// Replaces only the part that changed, so the cursor stays on the same words.
function replaceEditorText(next) {
  const old = editor.value;
  let start = 0;
  while (start < old.length && start < next.length && old[start] === next[start]) start++;
  let oldEnd = old.length;
  let nextEnd = next.length;
  while (oldEnd > start && nextEnd > start && old[oldEnd - 1] === next[nextEnd - 1]) { oldEnd--; nextEnd--; }
  editor.setRangeText(next.slice(start, nextEnd), start, oldEnd, "preserve");
}

function setConflict(current, on) {
  current.conflict = on;
  $("conflict").hidden = !on;
  if (on) setStatus("Not saved", "warn");
}

function showEditMessage(text) {
  $("edit-message").textContent = text;
  $("edit-message").hidden = !text;
  editor.hidden = Boolean(text);
}

async function showFile(root, parts, fromHome) {
  const path = parts.join("/");
  const current = {
    url: `/api/file?${apiQuery(root, path)}`,
    draftKey: `draft:${root}/${path}`,
    base: null,
    saved: "",
    crlf: false,
    saving: false,
    conflict: false,
  };
  doc = current;
  show("edit", parts.at(-1));
  $("edit-back").href = fromHome ? "#/" : hashFor(root, parts.slice(0, -1));
  $("edit-back").setAttribute("aria-label", fromHome ? "Back to home" : "Back to folder");
  $("conflict").hidden = true;
  showEditMessage("");
  editor.value = "";
  editor.disabled = true;
  setStatus("Opening…");

  let res;
  try {
    res = await fetchFile(current);
  } catch {
    if (doc === current) {
      setStatus("Offline", "warn");
      showEditMessage(`Unable to open this file. ${OFFLINE_HELP}`);
    }
    return;
  }
  if (doc !== current) return;
  if (!res.ok) {
    setStatus("Not opened", "warn");
    showEditMessage(await res.text());
    return;
  }
  const raw = decoder.decode(await res.arrayBuffer());
  if (doc !== current) return;
  adoptVersion(current, raw, res.headers.get("ETag"));
  editor.value = current.saved;
  editor.disabled = false;
  setStatus("Saved");

  const draft = readDraft(current);
  if (draft && draft.text !== current.saved) {
    editor.value = draft.text;
    if (draft.base === current.base) {
      save();
    } else {
      setConflict(current, true);
    }
  } else {
    clearDraft(current);
  }
}

async function save() {
  clearTimeout(saveTimer);
  const current = doc;
  if (!current || current.base === null || current.conflict || current.saving || !isDirty(current)) return;
  const sent = editor.value;
  current.saving = true;
  setStatus("Saving…");
  let savedOk = false;
  try {
    const res = await fetch(current.url, {
      method: "PUT",
      headers: { "If-Match": current.base },
      body: toDisk(current, sent),
    });
    if (res.ok) {
      current.base = res.headers.get("ETag");
      current.saved = sent;
      savedOk = true;
      if (doc === current && !isDirty(current)) {
        clearDraft(current);
        setStatus("Saved");
      }
    } else if (res.status === 412) {
      if (doc === current) {
        keepDraft(current);
        setConflict(current, true);
      }
    } else if (doc === current) {
      keepDraft(current);
      setStatus("Not saved", "warn");
    }
  } catch {
    if (doc === current) {
      keepDraft(current);
      setStatus("Offline, will retry", "warn");
    }
  } finally {
    current.saving = false;
  }
  if (savedOk && doc === current && isDirty(current)) scheduleSave();
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, SAVE_DELAY_MS);
}

async function checkForChanges() {
  const current = doc;
  if (!current || current.base === null || current.saving || current.conflict || document.hidden) return;
  if (isDirty(current)) return save();
  if (composing) return;
  const asked = current.base;
  try {
    const res = await fetchFile(current, { "If-None-Match": asked });
    if (res.status === 304) {
      if (doc === current && !isDirty(current)) setStatus("Saved");
      return;
    }
    if (!res.ok) {
      if (doc === current) setStatus(res.status === 404 ? "File not found" : "Not reachable", "warn");
      return;
    }
    const raw = decoder.decode(await res.arrayBuffer());
    // The phone moved on while this was in flight; the next round decides.
    if (doc !== current || current.base !== asked || current.saving || isDirty(current) || composing) return;
    adoptVersion(current, raw, res.headers.get("ETag"));
    replaceEditorText(current.saved);
    setStatus("Updated from PC");
  } catch {
    if (doc === current) setStatus("Offline", "warn");
  }
}

editor.addEventListener("input", () => {
  if (!doc) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(flushDraft, DRAFT_DELAY_MS);
  if (doc.conflict) return;
  setStatus("Saving…");
  scheduleSave();
});
editor.addEventListener("compositionstart", () => { composing = true; });
editor.addEventListener("compositionend", () => { composing = false; });

$("keep-mine").addEventListener("click", async () => {
  const current = doc;
  try {
    const res = await fetchFile(current);
    if (!res.ok) throw new Error();
    current.base = res.headers.get("ETag");
    setConflict(current, false);
    await save();
  } catch {
    setStatus("Offline, try again", "warn");
  }
});

$("use-pc").addEventListener("click", async () => {
  const current = doc;
  try {
    const res = await fetchFile(current);
    if (!res.ok) throw new Error();
    adoptVersion(current, decoder.decode(await res.arrayBuffer()), res.headers.get("ETag"));
    editor.value = current.saved;
    clearDraft(current);
    setConflict(current, false);
    setStatus("Saved");
  } catch {
    setStatus("Offline, try again", "warn");
  }
});

// ---- Routing ----

async function route(event) {
  // A pinned file opened from home goes back to home, not up through its folders.
  const fromHome = event && parseHash(new URL(event.oldURL).hash).length === 0;
  flushDraft();
  await save();
  doc = null;
  const [root, ...rest] = parseHash(location.hash);
  if (!root) return showRoots();
  if (/\.md$/i.test(rest.at(-1) ?? "")) return showFile(root, rest, fromHome);
  return showFolder(root, rest);
}

window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    flushDraft();
    save();
  } else {
    checkForChanges();
  }
});
window.addEventListener("online", checkForChanges);
setInterval(checkForChanges, POLL_MS);
route();
</script>
</body>
