  if (!searchIsOpen()) focusEditorAfterSearch = document.activeElement === editor;
  const picked = editor.value.slice(editor.selectionStart, editor.selectionEnd);
  if (focusEditorAfterSearch && picked && !picked.includes("\n")) $("search-input").value = picked;
  $("search-bar").hidden = false;
  $("search-input").focus();
  $("search-input").select();
  runSearch();
}

function closeSearch({ moveFocus = true } = {}) {
  if (!searchIsOpen()) return;
  const stillSearching = $("search-bar").contains(document.activeElement);
  clearTimeout(searchTimer);
  $("search-bar").hidden = true;
  clearSearchPaint();
  const match = searchMatches[searchIndex];
  searchMatches = [];
  searchIndex = -1;
  if (!moveFocus || !stillSearching) return;
  if (!focusEditorAfterSearch) {
    $("search-open").focus({ preventScroll: true });
    return;
  }
  // A caret, because a selection would let the next key replace the match.
  if (match) editor.setSelectionRange(match.end, match.end);
  focusEditor();
}

$("search-open").addEventListener("click", openSearch);
$("search-close").addEventListener("click", closeSearch);
$("search-previous").addEventListener("click", () => moveSearch(-1));
$("search-next").addEventListener("click", () => moveSearch(1));
for (const id of ["search-open", "search-previous", "search-next", "search-close"]) {
  // Keeping focus where it is keeps the phone's keyboard open.
  $(id).addEventListener("mousedown", (event) => event.preventDefault());
}
$("search-input").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(), SEARCH_DELAY_MS);
});
$("search-input").addEventListener("keydown", (event) => {
  if (event.key !== "Enter" || event.isComposing) return;
  event.preventDefault();
  moveSearch(event.shiftKey ? -1 : 1);
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && searchIsOpen() && !$("toc").open) {
    closeSearch();
    return;
  }
  const isFind = (event.ctrlKey || event.metaKey) && !event.shiftKey && !event.altKey && event.key.toLowerCase() === "f";
  if (!isFind || $("edit-screen").hidden || !doc?.history || $("toc").open) return;
  event.preventDefault();
  openSearch();
});

// ---- Reading position: a line and how far into it, because the same pixels are another place at another screen width ----

let scrollTimer = 0;

function topVisibleLine() {
  const top = $("note").scrollTop;
  let low = 0;
  let high = lineEls.length - 1;
  while (low < high) {
    const middle = Math.ceil((low + high) / 2);
    if (lineEls[middle].offsetTop <= top) low = middle;
    else high = middle - 1;
  }
  return low;
}

function keepScroll() {
  clearTimeout(scrollTimer);
  if (!doc?.scrollReady || doc.base === null || $("note").hidden) return;
  const top = $("note").scrollTop;
  const line = topVisibleLine();
  const el = lineEls[line];
  const body = JSON.stringify({ line, within: Math.max(0, top - el.offsetTop) / (el.offsetHeight || 1) });
  if (body === doc.scrollSent) return;
  doc.scrollSent = body;
  fetch(stateUrl(doc, "scroll"), { method: "PUT", body, keepalive: true }).catch(() => {});
}

function restoreScroll(saved, localTop) {
  const el = saved && lineEls[Math.min(saved.line, lineEls.length - 1)];
  $("note").scrollTop = el ? el.offsetTop + saved.within * el.offsetHeight : localTop;
}

$("note").addEventListener("scroll", () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(keepScroll, SCROLL_DELAY_MS);
}, { passive: true });

// Replaces only the part that changed, so the cursor stays on the same words.
function replaceEditorText(next, { fromOtherDevice = false } = {}) {
  const old = editor.value;
  let start = 0;
  while (start < old.length && start < next.length && old[start] === next[start]) start++;
  let oldEnd = old.length;
  let nextEnd = next.length;
  while (oldEnd > start && nextEnd > start && old[oldEnd - 1] === next[nextEnd - 1]) { oldEnd--; nextEnd--; }
  editor.setRangeText(next.slice(start, nextEnd), start, oldEnd, "preserve");
  paintNote();
  if (fromOtherDevice) return;
  trackChange({ separate: true });
  showChangesHint();
}

function setConflict(current, on) {
  current.conflict = on;
  $("conflict").hidden = !on;
  if (on) setStatus("Not saved", "warn");
}

function showEditMessage(text) {
  $("edit-message").textContent = text;
  $("edit-message").hidden = !text;
  $("note").hidden = Boolean(text);
}

async function showFile(root, parts, fromHome) {
  const path = parts.join("/");
  const current = {
    url: `/api/file?${apiQuery(root, path)}`,
    href: pathFor(root, parts),
    draftKey: `draft:${root}/${path}`,
    base: null,
    saved: "",
    crlf: false,
    saving: false,
    failing: false,
    conflict: false,
    marks: [],
    history: null,
    reviewed: null,
    stateTag: null,
    stateDirty: false,
    stateLoaded: false,
    synced: null,
    pushing: null,
    loadingState: false,
    reviewConfirmed: false,
    removedMarks: [],
    triedTexts: [],
    scrollReady: false,
    scrollSent: null,
  };
  closeSearch({ moveFocus: false });
  closeRenameForm();
  $("rename-open").disabled = true;
  lockConflictButtons(false);
  showMarksInNote({ marks: [] });
  doc = current;
  // The text goes in while the screen is still hidden, so it is laid out once instead of after the last note's.
  // The last text seen shows at once, locked until the PC answers.
  const cached = recallSeen(`note:${current.href}`);
  // Asked before the text is laid out, which takes a phone hundreds of milliseconds on a big note.
  const fileRequest = fetchFile(current, cached ? { "If-None-Match": cached.etag } : {});
  const stateRequest = fetchNoteState(current);
  const scrollRequest = fetchJson(stateUrl(current, "scroll")).catch(() => ({ value: null }));
  // Failures are handled where these are awaited; this only stops the browser reporting them as unhandled first.
  fileRequest.catch(() => {});
  stateRequest.catch(() => {});
  setEditorText(cached ? fromDisk(cached.raw) : "");
  show("edit", parts.at(-1), root, parts.slice(0, -1));
  $("edit-back").href = fromHome ? "/" : pathFor(root, parts.slice(0, -1));
  $("edit-back").setAttribute("aria-label", fromHome ? "Back to home" : "Back to folder");
  $("conflict").hidden = true;
  showEditMessage("");
  editor.readOnly = false;
  $("note").scrollTop = 0;
  $("toc-open").hidden = true;
  $("marks-open").hidden = true;
  $("search-open").hidden = true;
  $("read-toggle").hidden = true;
  $("read-toggle").setAttribute("aria-pressed", "false");
  $("read-view").hidden = true;
  $("read-view").replaceChildren();
  hideMarkPill();
  showUndoButtons(null);
  $("changes-view").hidden = true;
  $("note").hidden = false;
  $("changes-open").hidden = true;
  $("changes-open").setAttribute("aria-pressed", "false");
  editor.disabled = true;
  setStatus("Opening…");

  if (cached) markScreenReady();

  let res;
  try {
    res = await fileRequest;
  } catch {
    if (doc === current) {
      setStatus("Offline", "warn");
      showEditMessage(`Unable to open this file. ${OFFLINE_HELP}`);
    }
    return;
  }
  if (doc !== current) return;
  if (!res.ok && !(res.status === 304 && cached)) {
    setStatus("Not opened", "warn");
    const message = await res.text();
    const draft = readDraft(current);
    if (doc !== current) return;
    showEditMessage(message);
    if (res.status === 404 && draft) {
      $("edit-message").textContent = "File not found. Your unsaved text is below, so copy it before leaving.";
      $("note").hidden = false;
      setEditorText(draft.text);
      editor.readOnly = true;
      editor.disabled = false;
    }
    return;
  }
  const raw = res.status === 304 ? cached.raw : decoder.decode(await res.arrayBuffer());
  if (doc !== current) return;
  adoptVersion(current, raw, res.headers.get("ETag") ?? cached.etag);
  rememberSeen(`note:${current.href}`, { raw, etag: current.base });
  setEditorText(current.saved);
  markScreenReady();
  $("toc-open").hidden = false;
  $("marks-open").hidden = false;
  $("search-open").hidden = false;
  $("read-toggle").hidden = false;
  $("rename-open").disabled = false;
  setStatus("Saved");

  const draft = readDraft(current);
  if (draft && draft.text !== current.saved) {
    setEditorText(draft.text);
    // Versions are hashes, so a disk that returned to the draft's base looks untouched. Only a recent, undisputed draft saves itself.
    const safe = draft.base === current.base && !draft.conflict && Date.now() - (draft.at ?? 0) < DRAFT_AUTOSAVE_MS;
    if (safe) {
      save();
      showToast("Restored your unsaved text");
    } else {
      $("conflict-title").textContent = draft.base === current.base ? "You have older unsaved text." : "This file changed on the PC.";
      setConflict(current, true);
    }
  } else {
    clearDraft(current);
  }
  const localTop = readLocalState(current).scrollTop;
  await loadState(current, stateRequest);
  if (doc !== current) return;
  if (current.stateLoaded) editor.disabled = false;
  else if (!current.conflict) setStatus("Waiting for the PC…", "warn");
  const [scroll] = await Promise.all([
    scrollRequest,
    document.fonts.status === "loaded" ? null : Promise.race([document.fonts.ready, new Promise((done) => setTimeout(done, FONT_WAIT_MS))]),
  ]);
  if (doc !== current) return;
  restoreScroll(scroll.value, localTop);
  current.scrollReady = true;
  if (doc !== current) return;
  // Changes not yet read show in the editor first; otherwise the note opens the way it was last read, contents first if it is long.
  const changed = hasChanges(current);
  if (!changed && readingPreferred()) {
    await openReading();
  } else {
    showReviewDiff();
    revealFirstChange();
  }
  if (doc !== current || changed || current.conflict || paintedHeadings.length < MIN_HEADINGS_TO_AUTO_OPEN) return;
  openContents();
  // Nobody pressed anything yet, so no button should light up with a focus ring.
  $("toc").focus({ preventScroll: true });
}

async function save() {
  clearTimeout(saveTimer);
  const current = doc;
  if (!current || current.base === null || current.conflict || current.saving || !isDirty(current)) return;
  const sent = editor.value;
  current.triedTexts = [...current.triedTexts.filter((text) => text !== sent), sent].slice(-MAX_TRIED_TEXTS);
  current.saving = true;
  await settleState(current);
  // Failed saves retry every few seconds, and showing each attempt would make the status flicker.
  if (!current.failing && doc === current) setStatus("Saving…");
  let savedOk = false;
  try {
    const upload = await packed(toDisk(current, sent));
    const res = await fetch(current.url, {
      method: "PUT",
      headers: { "If-Match": current.base, ...upload.headers },
      body: upload.body,
      signal: AbortSignal.timeout(WRITE_TIMEOUT_MS),
    });
    if (res.ok) {
      current.base = res.headers.get("ETag");
      current.saved = sent;
      current.triedTexts = [];
      current.failing = false;
      savedOk = true;
      settleDraft(current, sent);
      if (doc === current && !isDirty(current)) {
        clearDraft(current);
        setStatus("Saved");
      }
    } else if (res.status === 412) {
      // The answer to an earlier save can get lost after it worked, and this device's own text is no conflict.
      const latest = await fetchFile(current);
      const raw = latest.ok ? decoder.decode(await latest.arrayBuffer()) : null;
      if (raw !== null && current.triedTexts.includes(fromDisk(raw))) {
        adoptVersion(current, raw, latest.headers.get("ETag"));
        current.failing = false;
        savedOk = true;
        settleDraft(current, current.saved);
        if (doc === current && !isDirty(current)) {
          clearDraft(current);
          setStatus("Saved");
        }
      } else if (doc === current) {
        $("conflict-title").textContent = "This file changed on the PC.";
        setConflict(current, true);
        keepDraft(current);
      }
    } else if (doc === current) {
      keepDraft(current);
      current.failing = true;
      setStatus("Not saved, will retry", "warn");
    }
  } catch {
    if (doc === current) {
      keepDraft(current);
      current.failing = true;
      setStatus("Offline, will retry", "warn");
    }
  } finally {
    current.saving = false;
  }
  if (savedOk && doc === current && isDirty(current)) scheduleSave();
  else if (savedOk && doc !== current) sendLeftBehind(current);
}

// Typing during a save and then leaving has no later save to carry it. If-Match keeps this as safe as any other save.
async function sendLeftBehind(current) {
  const draft = readDraft(current);
  if (!draft || draft.conflict) return;
  try {
    const upload = await packed(toDisk(current, draft.text));
    const res = await fetch(current.url, {
      method: "PUT",
      headers: { "If-Match": current.base, ...upload.headers },
      body: upload.body,
      signal: AbortSignal.timeout(WRITE_TIMEOUT_MS),
    });
    if (res.ok) localStorage.removeItem(current.draftKey);
  } catch {}
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, SAVE_DELAY_MS);
}

async function retryLoadingState(current) {
  if (current.loadingState) return;
  current.loadingState = true;
  await loadState(current, fetchNoteState(current));
  current.loadingState = false;
  if (doc !== current || !current.stateLoaded) return;
  editor.disabled = false;
  if (!current.conflict) setStatus("Saved");
  showReviewDiff();
}

// A slow link can make one check outlast the poll interval; a second one would restart the same download.
async function checkForChanges() {
  const current = doc;
  if (!current || current.checking) return;
  current.checking = true;
  try {
    await checkNote(current);
  } finally {
    current.checking = false;
  }
}

async function checkNote(current) {
  if (current.base !== null && !current.stateLoaded && !current.loadingState && !document.hidden && current.scrollReady) await retryLoadingState(current);
  if (current.base === null || current.saving || current.conflict || document.hidden) return;
  if (isDirty(current)) return save();
  if (composing) return;
  if (current.stateDirty || current.pushing) await settleState(current);
  if (doc !== current) return;
  const asked = current.base;
  try {
    const res = await fetchFile(current, { "If-None-Match": asked });
    if (res.status === 304) {
      if (doc === current && !isDirty(current) && current.stateLoaded) setStatus("Saved");
      if (current.stateLoaded) await pullState(current);
      return;
    }
    if (!res.ok) {
      if (doc === current) setStatus(res.status === 404 ? "File not found" : "Not reachable", "warn");
      return;
    }
    const raw = decoder.decode(await res.arrayBuffer());
    const remote = await fetchNoteState(current, current.stateTag ? { "If-None-Match": current.stateTag } : {})
      .then((answer) => (answer.unchanged ? { value: current.synced?.remote ?? null, tag: current.stateTag } : answer))
      .catch(() => ({ value: null }));
    // The phone moved on while this was in flight; the next round decides.
    if (doc !== current || current.base !== asked || current.saving || isDirty(current) || composing) return;
    adoptVersion(current, raw, res.headers.get("ETag"));
    // State made for exactly this text means another device typed it, so it isn't a change to review.
    const fromOtherDevice = current.stateLoaded && !current.stateDirty && !current.pushing && remote.value?.history.hash === hashText(current.saved);
    const textBefore = editor.value;
    let base = lingeringBase();
    keepReadingSpot(clearReviewDiff);
    replaceEditorText(current.saved, { fromOtherDevice });
    if (fromOtherDevice) {
      adoptState(current, remote);
      // That device's typing is no change to show, so it goes into the text the dimmed changes are kept against.
      if (base !== null) base = undoIntoReview(base, textBefore, current.saved);
    }
    showReviewDiff({ base });
    setStatus("Updated");
  } catch {
    if (doc === current) setStatus("Offline", "warn");
  }
}

editor.addEventListener("input", () => {
  const textBefore = paintedText;
  noteChanged();
  followOwnEdit(textBefore);
  trackChange();
});

function noteChanged() {
  lastEditAt = Date.now();
  hideMarkPill();
  paintNote();
  if (!doc) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(flushDraft, DRAFT_DELAY_MS);
  if (doc.conflict) return;
  if (!doc.failing) setStatus("Saving…");
  scheduleSave();
}

editor.addEventListener("compositionstart", () => { composing = true; });
editor.addEventListener("compositionend", () => { composing = false; });

function lockConflictButtons(locked) {
  $("keep-mine").disabled = locked;
  $("use-pc").disabled = locked;
}

$("keep-mine").addEventListener("click", async () => {
  const current = doc;
  lockConflictButtons(true);
  try {
    const res = await fetchFile(current);
    if (!res.ok) throw new Error();
    const raw = decoder.decode(await res.arrayBuffer());
    if (doc !== current) return;
    // Compares with what's on disk now, or text equal to the older version would look like there's nothing to save.
    adoptVersion(current, raw, res.headers.get("ETag"));
    setConflict(current, false);
    // Saving overwrites the PC's version, so it goes into Undo first: one step to it, then one back to this text.
    // Undoing the second brings the PC's version back as changes not yet read.
    const mine = editor.value;
    if (current.history && current.saved !== mine) {
      record(current.history, current.saved, Date.now(), { separate: true });
      record(current.history, mine, Date.now(), { separate: true, keepsReview: true });
      showUndoButtons(current.history);
    }
    // Empty steps mean they stayed for the other text, and sending them would wipe the server's.
    if (current.synced) {
      const { history } = stateNow(current);
      current.synced = { ...current.synced, local: { marks: current.synced.local.marks, history: history.done.length || history.undone.length ? undefined : history } };
    }
    current.stateDirty = current.stateLoaded;
    await save();
  } catch {
    setStatus("Unable to reach the file. Try again", "warn");
  } finally {
    if (doc === current) lockConflictButtons(false);
  }
});

$("use-pc").addEventListener("click", async () => {
  const current = doc;
  lockConflictButtons(true);
  try {
    const res = await fetchFile(current);
    if (!res.ok) throw new Error();
    const raw = decoder.decode(await res.arrayBuffer());
    if (doc !== current) return;
    // Still held back as a conflict here, so what gets sent can't replace the PC version's undo steps.
    await settleState(current);
    const remote = await fetchNoteState(current).catch(() => ({ value: null }));
    if (doc !== current) return;
    const mine = editor.value;
    adoptVersion(current, raw, res.headers.get("ETag"));
    setEditorText(current.saved);
    clearDraft(current);
    clearPending(current);
    current.failing = false;
    setConflict(current, false);
    setStatus("Saved");
    // That text may have come from another device, whose undo steps and review already belong to it.
    const fits = current.stateLoaded && !current.stateDirty && !current.pushing && remote.value?.history.hash === hashText(current.saved);
    if (fits) {
      adoptState(current, remote);
      // That device's steps replace this one's, so this device's text goes on top of them: Undo still brings it back.
      if (current.history && mine !== current.saved) {
        record(current.history, mine, Date.now(), { separate: true, keepsReview: true });
        record(current.history, current.saved, Date.now(), { separate: true });
        showUndoButtons(current.history);
        scheduleState(current);
      }
      showReviewDiff();
      return;
    }
    // The review on the server never had the discarded typing replayed into it.
    if (current.synced) current.reviewed = current.synced.remote.reviewed;
    trackChange({ separate: true });
    showChangesHint();
    showReviewDiff();
  } catch {
    setStatus("Offline, try again", "warn");
  } finally {
    if (doc === current) lockConflictButtons(false);
  }
});

// ---- Routing ----

function route(fromHome = false) {
  closeSearch({ moveFocus: false });
  closeRenameForm();
  $("toc").close();
  cancelAnimationFrame(flight);
  keepScroll();
  if (doc && !hasChanges(doc)) {
    changedPins.delete(doc.href);
    folderChanged.delete(doc.href);
  }
  // After the reading position is taken, since struck-out text going away moves the lines.
  clearReviewDiff();
  if (doc?.base) rememberSeen(`note:${doc.href}`, { raw: toDisk(doc, doc.saved), etag: doc.base });
  leaveState(doc);
  flushDraft();
  // Not awaited: save() takes the note and its text before its first await, and the draft is kept by now.
  save();
  doc = null;
  const [root, ...rest] = parsePath(location.pathname);
  if (!root) return showRoots();
  if (/\.md$/i.test(rest.at(-1) ?? "")) return showFile(root, rest, fromHome);
  return showFolder(root, rest);
}

// Links saved before URLs became real paths look like /#/folder/note.md.
if (location.hash.startsWith("#/")) history.replaceState(null, "", location.hash.slice(1));

let currentPath = location.pathname;

function changeRoute(browserAnimatesIt) {
  const from = parsePath(currentPath).length;
  const to = parsePath(location.pathname).length;
  currentPath = location.pathname;
  // A pinned file opened from home goes back to home, not up through its folders.
  const fromHome = from === 0;
  if (!document.startViewTransition || browserAnimatesIt || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    route(fromHome);
    return;
  }
  // The slide waits for the next screen's content, but never long enough to feel stuck on a slow connection.
  const ready = new Promise((done) => (markScreenReady = done));
  const update = () => Promise.race([route(fromHome), ready, new Promise((done) => setTimeout(done, CONTENT_WAIT_MS))]);
  document.startViewTransition({ update, types: [to < from ? "back" : "forward"] });
}

function navigate(path) {
  if (path === location.pathname) return;
  history.pushState(null, "", path);
  changeRoute(false);
}

document.addEventListener("click", (event) => {
  const link = event.target.closest("a[href]");
  if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  event.preventDefault();
  navigate(link.getAttribute("href"));
});
// Android's back gesture draws its own animation, and a second one on top would look broken.
window.addEventListener("popstate", (event) => changeRoute(event.hasUAVisualTransition));
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    keepScroll();
    leaveState(doc);
    flushDraft();
    save();
  } else {
    checkForChanges();
    if (!$("list-screen").hidden) refreshDots();
  }
});
window.addEventListener("online", checkForChanges);
setInterval(() => {
  checkForChanges();
  if (!$("list-screen").hidden && !document.hidden) refreshDots();
}, POLL_MS);
route();
</script>
</body>
</html>
