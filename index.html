<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#100F0F">
<title>MD Phone</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #100F0F;
    --text: #CECDC3;
    --muted: #878580;
    --line: #282726;
    --pressed: #1C1B1A;
    --sheet: #1C1B1A;
    --accent: #3AA99F;
    --on-accent: #100F0F;
    --selection: #164F4A;
    --warn: #E8705F;
    --warn-bg: #301A12;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.5 system-ui, sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: var(--selection); }
  [hidden] { display: none !important; }
  svg { display: block; width: 20px; height: 20px; flex: none; }
  .icon {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .screen { height: 100dvh; display: flex; flex-direction: column; }
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 52px;
    padding-block: 4px;
    padding-inline: 4px 16px;
    border-block-end: 1px solid var(--line);
  }
  #list-screen header { padding-inline-end: 4px; }
  #edit-screen header { padding-inline-end: 4px; }
  #status { padding-inline-end: 4px; }
  /* One line only, so the header keeps its height and the note never shifts when undo appears mid-typing. */
  #edit-title { display: block; white-space: nowrap; text-overflow: ellipsis; }
  #edit-screen .titles { min-width: 64px; }
  .note-action {
    flex: none;
    display: grid;
    place-items: center;
    width: 44px;
    padding: 0;
    color: var(--muted);
    border: 0;
  }
  #list-screen .titles { padding-inline-start: 12px; }
  #list-back:not([hidden]) + .titles { padding-inline-start: 0; }
  .titles { flex: 1; min-width: 0; }
  .where {
    display: block;
    font-size: 0.8125rem;
    line-height: 1.3;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .where:empty { display: none; }
  h1 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  h1:focus { outline: none; }
  .back {
    flex: none;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    color: var(--accent);
    border-radius: 8px;
  }
  .back svg { width: 24px; height: 24px; margin-inline-start: -2px; }
  #status {
    flex: 0 1 auto;
    min-width: 0;
    font-size: 0.875rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #status[data-tone="warn"] { color: var(--warn); font-weight: 600; }

  button {
    min-height: 44px;
    padding-inline: 16px;
    font: inherit;
    font-size: 0.9375rem;
    font-weight: 600;
    white-space: nowrap;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--muted);
    border-radius: 8px;
  }
  button:disabled { opacity: 0.6; }
  #new-file { flex: none; color: var(--accent); border-color: transparent; padding-inline: 12px; }
  #new-create { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }

  #new-form {
    flex: none;
    padding: 12px 16px 16px;
    border-block-end: 1px solid var(--line);
  }
  #new-form label { display: block; margin-block-end: 4px; font-size: 0.875rem; color: var(--muted); }
  .new-row { display: flex; gap: 8px; }
  #new-name {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    padding-inline: 12px;
    font: inherit;
    color: inherit;
    caret-color: var(--accent);
    background: transparent;
    border: 1px solid var(--muted);
    border-radius: 8px;
  }
  #new-name::placeholder { color: var(--muted); opacity: 1; }
  #new-error { margin-block: 8px 0; font-size: 0.875rem; color: var(--warn); }

  #list-body { flex: 1; min-height: 0; overflow-y: auto; padding-block-end: 24px; }
  .rows { margin: 0; padding-block: 4px; padding-inline: 0; list-style: none; }
  .rows li { position: relative; display: flex; align-items: center; background: var(--bg); }
  .rows a {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 48px;
    padding-block: 10px;
    padding-inline: 16px;
    color: inherit;
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .rows a span { flex: 1; min-width: 0; }
  .rows small { display: block; font-size: 0.875rem; line-height: 1.35; color: var(--muted); }
  .rows .kind { color: var(--muted); }
  .rows .is-file .kind { color: var(--accent); }
  .rows .chevron { color: var(--muted); width: 16px; height: 16px; }
  .pin {
    flex: none;
    align-self: stretch;
    display: grid;
    place-items: center;
    width: 52px;
    min-height: 48px;
    padding: 0;
    color: var(--muted);
    border: 0;
    border-radius: 0;
  }
  .pin[aria-pressed="true"] { color: var(--accent); }
  .pin[aria-pressed="true"] svg { fill: currentColor; }
  #pinned-section h2 {
    margin: 0;
    padding-block: 20px 4px;
    padding-inline: 16px;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--muted);
  }
  .message { margin: 0; padding: 24px 16px; color: var(--muted); }
  .back:active, .rows a:active, .pin:active, #new-file:active { background: var(--pressed); }

  #conflict {
    flex: none;
    padding: 12px 16px;
    background: var(--warn-bg);
    border-block-end: 1px solid var(--line);
  }
  #conflict p { margin: 0 0 12px; font-size: 0.9375rem; }
  #conflict strong { display: block; font-weight: 600; }
  #conflict div { display: flex; flex-wrap: wrap; gap: 8px; }

  #note { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; }
  #note-sheet { position: relative; max-width: 42rem; margin-inline: auto; }
  #painted, #editor {
    display: block;
    width: 100%;
    margin: 0;
    padding-block: 20px 40vh;
    padding-inline: 16px;
    border: 0;
    font: 1.125rem/1.65 "Noto Serif", Georgia, serif;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  /* The textarea takes the typing and the caret; #painted shows the same text, so colors never touch the file. */
  #editor {
    position: absolute;
    inset: 0;
    height: 100%;
    overflow: hidden;
    outline: 0;
    resize: none;
    -webkit-text-fill-color: transparent;
    caret-color: var(--accent);
    background: transparent;
  }
  #editor::selection { background: rgb(58 169 159 / 0.35); }
  #painted div { min-height: 1lh; }
  #painted div[data-marked] { position: relative; }
  #painted div[data-marked]::before {
    content: "";
    position: absolute;
    inset-block: 4px;
    inset-inline-start: -10px;
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
  }
  .h1 { color: #D0A215; }
  .h2 { color: #3AA99F; }
  .h3 { color: #879A39; }
  .h4 { color: #4385BE; }
  .h5 { color: #8B7EC8; }
  .h6 { color: #CE5D97; }

  #toc-open {
    flex: none;
    display: grid;
    place-items: center;
    width: 44px;
    padding: 0;
    color: var(--muted);
    border: 0;
  }
  #toc {
    width: 100%;
    max-width: 42rem;
    max-height: 70dvh;
    margin-block: auto 0;
    margin-inline: auto;
    padding: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-padding-block-start: 52px;
    color: var(--text);
    background: var(--sheet);
    border: 0;
    border-start-start-radius: 16px;
    border-start-end-radius: 16px;
  }
  #toc:focus { outline: none; }
  #toc::backdrop { background: rgb(0 0 0 / 0.5); }
  #toc-bar {
    position: sticky;
    z-index: 1;
    inset-block-start: 0;
    display: flex;
    align-items: center;
    padding-block: 4px;
    padding-inline: 4px;
    background: var(--sheet);
  }
  #toc-bar #mark-here {
    display: flex;
    gap: 8px;
    align-items: center;
    width: auto;
    margin-inline-end: auto;
    padding-inline: 12px;
    color: var(--accent);
  }
  #toc h2 {
    margin: 0;
    padding-block: 8px 4px;
    padding-inline: 16px;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--muted);
  }
  #toc-bar button {
    display: grid;
    place-items: center;
    width: 44px;
    padding: 0;
    border: 0;
  }
  #toc-bar button:active { background: var(--line); }
  #toc-empty { margin: 0; padding: 4px 16px 24px; color: var(--muted); }
  .toc-rows { margin: 0; padding: 0 0 12px; list-style: none; }
  #marks-list { padding-block-end: 0; }
  #marks-list li { display: flex; }
  .toc-rows .mark-go { flex: 1; min-width: 0; }
  .toc-rows .mark-go small { display: block; font-size: 0.8125rem; color: var(--muted); }
  .toc-rows .mark-remove { flex: none; display: grid; place-items: center; width: 44px; padding: 0; color: var(--muted); }
  .toc-rows button {
    display: block;
    width: 100%;
    min-height: 44px;
    padding-block: 10px;
    padding-inline: calc(16px + var(--depth, 0) * 16px) 16px;
    font-weight: 400;
    line-height: 1.35;
    text-align: start;
    white-space: normal;
    overflow-wrap: anywhere;
    border: 0;
    border-radius: 0;
  }
  .toc-rows button[aria-current] { background: var(--line); }
  .toc-rows button:active { background: var(--line); }

  @media (hover: hover) {
    .back:hover, .rows a:hover, .pin:hover, #new-file:hover, #toc-open:hover, .note-action:hover { background: var(--pressed); }
    .toc-rows button:hover, #toc-bar button:hover { background: var(--line); }
  }
  @media (prefers-reduced-motion: no-preference) {
    button:not(:disabled), .back { transition: scale 150ms ease-out; }
    button:not(:disabled):active, .back:active { scale: 0.96; }
    #conflict, #new-form {
      transition: opacity 150ms ease-out, translate 150ms ease-out;
      @starting-style { opacity: 0; translate: 0 -4px; }
    }
    ::view-transition { pointer-events: none; }
    ::view-transition-group(root) { animation-duration: 200ms; }
    ::view-transition-old(root), ::view-transition-new(root) {
      mix-blend-mode: normal;
      animation-duration: 200ms;
      animation-timing-function: cubic-bezier(0.32, 0.72, 0, 1);
    }
    html:active-view-transition-type(forward)::view-transition-old(root) { animation-name: to-left; }
    html:active-view-transition-type(forward)::view-transition-new(root) { animation-name: from-right; }
    html:active-view-transition-type(back)::view-transition-old(root) { z-index: 1; animation-name: to-right; }
    html:active-view-transition-type(back)::view-transition-new(root) { animation-name: from-left; }
    @keyframes to-left { to { translate: -30% 0; } }
    @keyframes from-right { from { translate: 100% 0; } }
    @keyframes to-right { to { translate: 100% 0; } }
    @keyframes from-left { from { translate: -30% 0; } }
    .toc-rows button:active { scale: none; }
    #toc[open] {
      transition: translate 200ms cubic-bezier(0.32, 0.72, 0, 1);
      @starting-style { translate: 0 100%; }
    }
    #toc[open]::backdrop {
      transition: opacity 200ms ease-out;
      @starting-style { opacity: 0; }
    }
  }
</style>
</head>
<body>
<svg hidden>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>

</svg>

<main id="list-screen" class="screen" hidden>
  <header>
    <a id="list-back" class="back" aria-label="Up one folder"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></a>
    <div class="titles">
      <h1 id="list-title" tabindex="-1"></h1>
      <small id="list-where" class="where"></small>
    </div>
    <button id="new-file" type="button" aria-expanded="false" aria-controls="new-form" hidden>New file</button>
  </header>
  <form id="new-form" hidden novalidate>
    <label for="new-name">File name</label>
    <div class="new-row">
      <input id="new-name" name="filename" autocomplete="off" spellcheck="false" enterkeyhint="go" placeholder="notes.md" aria-describedby="new-error">
      <button id="new-create" type="submit">Create</button>
    </div>
    <p id="new-error" hidden></p>
  </form>
  <div id="list-body">
    <ul id="items" class="rows"></ul>
    <p id="message" class="message" role="status" hidden></p>
    <section id="pinned-section" aria-labelledby="pinned-heading" hidden>
      <h2 id="pinned-heading">Pinned</h2>
      <ul id="pinned" class="rows"></ul>
    </section>
  </div>
</main>

<main id="edit-screen" class="screen" hidden>
  <header>
    <a id="edit-back" class="back" aria-label="Back to folder"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></a>
    <div class="titles">
      <h1 id="edit-title" tabindex="-1"></h1>
      <small id="edit-where" class="where"></small>
    </div>
    <span id="status" role="status"></span>
    <button id="undo" class="note-action" type="button" aria-label="Undo" hidden><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg></button>
    <button id="redo" class="note-action" type="button" aria-label="Redo" hidden><svg class="icon" aria-hidden="true"><use href="#i-redo"/></svg></button>
    <button id="toc-open" type="button" aria-label="Contents" aria-haspopup="dialog" hidden><svg class="icon" aria-hidden="true"><use href="#i-toc"/></svg></button>
  </header>
  <section id="conflict" role="alert" hidden>
    <p><strong>This file changed on the PC.</strong> Nothing was overwritten. Keep your text to replace the PC version, or use the PC version to discard your text.</p>
    <div>
      <button id="keep-mine" type="button">Keep my text</button>
      <button id="use-pc" type="button">Use PC version</button>
    </div>
  </section>
  <p id="edit-message" class="message" hidden></p>
  <div id="note">
    <div id="note-sheet">
      <div id="painted" aria-hidden="true"></div>
      <textarea id="editor" aria-labelledby="edit-title" autocapitalize="sentences" spellcheck="false" disabled></textarea>
    </div>
  </div>
  <dialog id="toc" closedby="any" aria-label="Marks and contents" tabindex="-1">
    <div id="toc-bar">
      <button id="mark-here" type="button"><svg class="icon" aria-hidden="true"><use href="#i-mark"/></svg>Mark this spot</button>
      <button id="go-top" type="button" aria-label="Go to top"><svg class="icon" aria-hidden="true"><use href="#i-top"/></svg></button>
      <button id="go-bottom" type="button" aria-label="Go to bottom"><svg class="icon" aria-hidden="true"><use href="#i-bottom"/></svg></button>
    </div>
    <section id="marks-section" aria-labelledby="marks-heading" hidden>
      <h2 id="marks-heading">Marks</h2>
      <ul id="marks-list" class="toc-rows"></ul>
    </section>
    <h2>Contents</h2>
    <p id="toc-empty" hidden>No headings yet. Start a line with # to add one.</p>
    <ul id="toc-list" class="toc-rows"></ul>
  </dialog>
</main>

<script type="module">
import { parseHeadings } from "/headings.js";
import { createHistory, hashText, record, redo, undo } from "/history.js";
import { followEdit, relocate } from "/marks.js";

const SAVE_DELAY_MS = 800;
const JUMP_GAP_PX = 12;
const END_GAP_PX = 48;
const FLY_MS = 180;
const CONTENT_WAIT_MS = 250;
const SCROLL_DELAY_MS = 200;
const HISTORY_DELAY_MS = 500;
const MIN_HEADINGS_TO_AUTO_OPEN = 5;
const DRAFT_DELAY_MS = 250;
const POLL_MS = 3000;
const OFFLINE_HELP = "Check that the PC is on and Tailscale is connected, then pull down to reload.";

const $ = (id) => document.getElementById(id);
const editor = $("editor");
const decoder = new TextDecoder("utf-8", { ignoreBOM: true });
let doc = null;
let folder = null;
let saveTimer = 0;
let draftTimer = 0;
let composing = false;

const pathFor = (root, parts) => "/" + [root, ...parts].map(encodeURIComponent).join("/");
const parsePath = (path) => path.split("/").filter(Boolean).map(decodeURIComponent);
const whereText = (parents) => parents.join(" / ");
const apiQuery = (root, path) => `root=${encodeURIComponent(root)}&path=${encodeURIComponent(path)}`;

// shortcut: pins stay in this browser and go if its site data is cleared, move them to a file on the PC if they must follow other devices.
let redrawFolder = null;
const pins = new Set(loadPins());

function loadPins() {
  try {
    const saved = JSON.parse(localStorage.getItem("pins"));
    // Pins saved before URLs became real paths start with "#".
    return Array.isArray(saved) ? saved.map((pin) => pin.replace(/^#/, "")) : [];
  } catch {
    return [];
  }
}

function togglePin(href) {
  const pinned = !pins.delete(href);
  if (pinned) pins.add(href);
  try { localStorage.setItem("pins", JSON.stringify([...pins])); } catch {}
  return pinned;
}

// Runs on every keystroke, so it must not touch the DOM when nothing changed.
function setStatus(text, tone = "") {
  const status = $("status");
  if (status.textContent !== text) status.textContent = text;
  if (status.dataset.tone !== tone) status.dataset.tone = tone;
}

function show(screen, title, parents = []) {
  $("list-screen").hidden = screen !== "list";
  $("edit-screen").hidden = screen !== "edit";
  document.title = title;
  const heading = $(screen === "list" ? "list-title" : "edit-title");
  heading.textContent = title;
  $(screen === "list" ? "list-where" : "edit-where").textContent = whereText(parents);
  heading.focus({ preventScroll: true });
}

// ---- Folder view ----

function icon(name, className) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", `icon ${className}`);
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", name);
  svg.append(use);
  return svg;
}

function buildRow({ href, label, isFile, hint }) {
  const row = document.createElement("li");
  row.dataset.key = href;
  const link = document.createElement("a");
  link.href = href;
  if (isFile) link.className = "is-file";
  const text = document.createElement("span");
  text.textContent = label;
  if (hint) {
    const where = document.createElement("small");
    where.textContent = hint;
    text.append(where);
  }
  link.append(icon(isFile ? "#i-file" : "#i-folder", "kind"), text);
  if (!isFile) link.append(icon("#i-next", "chevron"));
  row.append(link);
  if (isFile) row.append(buildPinButton(href, hint ? `${hint} / ${label}` : label));
  return row;
}

function buildPinButton(href, name) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "pin";
  button.setAttribute("aria-label", `Pin ${name}`);
  button.setAttribute("aria-pressed", String(pins.has(href)));
  button.append(icon("#i-pin", ""));
  button.addEventListener("click", () => {
    button.setAttribute("aria-pressed", String(togglePin(href)));
    if (redrawFolder) moveRows(redrawFolder, href);
  });
  return button;
}

function renderItems(links, emptyText) {
  $("items").replaceChildren(...links.map(buildRow));
  $("items").hidden = links.length === 0;
  $("message").hidden = links.length > 0;
  $("message").textContent = links.length ? "" : emptyText;
}

function renderPinned() {
  const rows = [...pins]
    .map((href) => {
      const [root, ...parts] = parsePath(href);
      return { href, isFile: true, label: parts.at(-1), hint: whereText([root, ...parts.slice(0, -1)]) };
    })
    .sort((a, b) => a.label.localeCompare(b.label) || a.hint.localeCompare(b.hint));
  $("pinned").replaceChildren(...rows.map(buildRow));
  $("pinned-section").hidden = rows.length === 0;
}

// Slides each row from its old place to its new one, so a pinned file visibly goes to the top.
function moveRows(redraw, movedKey) {
  const rows = () => [...$("items").children];
  const before = new Map(rows().map((row) => [row.dataset.key, row.getBoundingClientRect().top]));
  redraw();
  const moved = rows().find((row) => row.dataset.key === movedKey);
  moved?.querySelector(".pin").focus({ preventScroll: true });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (const row of rows()) {
    const top = row.getBoundingClientRect().top;
    const from = before.get(row.dataset.key);
    const onScreen = (y) => y > -row.offsetHeight && y < innerHeight;
    if (from === top || (!onScreen(from) && !onScreen(top))) continue;
    row.animate(
      { translate: [`0 ${from - top}px`, "0 0"], zIndex: row === moved ? [1, 1] : [0, 0] },
      { duration: 200, easing: "cubic-bezier(0.2, 0, 0, 1)" },
    );
  }
}

function closeNewForm() {
  $("new-form").hidden = true;
  $("new-file").setAttribute("aria-expanded", "false");
  $("new-file").textContent = "New file";
}

async function showRoots() {
  folder = null;
  redrawFolder = null;
  const openedAt = location.pathname;
  show("list", "MD Phone");
  $("list-back").hidden = true;
  $("new-file").hidden = true;
  closeNewForm();
  renderItems([], "Opening…");
  renderPinned();
  try {
    const names = await (await fetch("/api/roots")).json();
    if (location.pathname !== openedAt) return;
    renderItems(names.map((name) => ({ href: pathFor(name, []), label: name })), "No folders are set up. Add one to roots.json on the PC.");
  } catch {
    if (location.pathname === openedAt) renderItems([], `Unable to reach the PC. ${OFFLINE_HELP}`);
  }
}

async function showFolder(root, parts) {
  redrawFolder = null;
  const openedAt = location.pathname;
  show("list", parts.at(-1) ?? root, parts.length ? [root, ...parts.slice(0, -1)] : []);
  $("list-back").hidden = false;
  $("list-back").href = parts.length ? pathFor(root, parts.slice(0, -1)) : "/";
  $("new-file").hidden = true;
  $("pinned-section").hidden = true;
  closeNewForm();
  folder = { root, parts };
  renderItems([], "Opening…");
  try {
    const res = await fetch(`/api/list?${apiQuery(root, parts.join("/"))}`);
    if (!res.ok) throw new Error(await res.text());
    const { dirs, files } = await res.json();
    if (location.pathname !== openedAt) return;
    const hrefOf = (name) => pathFor(root, [...parts, name]);
    const fileRow = (name) => ({ href: hrefOf(name), label: name, isFile: true });
    redrawFolder = () => renderItems([
      ...files.filter((name) => pins.has(hrefOf(name))).map(fileRow),
      ...dirs.map((name) => ({ href: hrefOf(name), label: name })),
      ...files.filter((name) => !pins.has(hrefOf(name))).map(fileRow),
    ], "No markdown files here yet. Tap New file to add one.");
    $("new-file").hidden = false;
    redrawFolder();
  } catch {
    if (location.pathname === openedAt) renderItems([], `Unable to open this folder. ${OFFLINE_HELP}`);
  }
}

$("new-file").addEventListener("click", () => {
  if (!$("new-form").hidden) {
    closeNewForm();
    return;
  }
  $("new-name").value = "";
  $("new-name").removeAttribute("aria-invalid");
  $("new-error").hidden = true;
  $("new-form").hidden = false;
  $("new-file").setAttribute("aria-expanded", "true");
  $("new-file").textContent = "Cancel";
  $("new-name").focus();
});

$("new-name").addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  closeNewForm();
  $("new-file").focus();
});

$("new-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const { root, parts } = folder;
  let problem;
  $("new-create").disabled = true;
  try {
    const query = `${apiQuery(root, parts.join("/"))}&name=${encodeURIComponent($("new-name").value)}`;
    const res = await fetch(`/api/create?${query}`, { method: "PUT" });
    if (res.ok) {
      const { name } = await res.json();
      navigate(pathFor(root, [...parts, name]));
      return;
    }
    problem = await res.text();
  } catch {
    problem = "Unable to reach the PC. Check your connection and try again.";
  } finally {
    $("new-create").disabled = false;
  }
  $("new-error").textContent = problem;
  $("new-error").hidden = false;
  $("new-name").setAttribute("aria-invalid", "true");
  $("new-name").focus();
});

// ---- Draft kept on the phone, so a dropped connection or a killed tab loses nothing ----

function keepDraft(current) {
  clearTimeout(draftTimer);
  try {
    localStorage.setItem(current.draftKey, JSON.stringify({ text: editor.value, base: current.base }));
  } catch {}
}
function clearDraft(current) {
  clearTimeout(draftTimer);
  try { localStorage.removeItem(current.draftKey); } catch {}
}
function readDraft(current) {
  try { return JSON.parse(localStorage.getItem(current.draftKey)); } catch { return null; }
}
function flushDraft() {
  if (doc && doc.base !== null && isDirty(doc)) keepDraft(doc);
}

// ---- Editor ----

const isDirty = (current) => editor.value !== current.saved;
// A textarea always reports "\n", so a Windows file gets its "\r\n" back on save.
const toDisk = (current, text) => (current.crlf ? text.replace(/\n/g, "\r\n") : text);
const fromDisk = (text) => text.replace(/\r\n?/g, "\n");
const fetchFile = (current, headers = {}) => fetch(current.url, { cache: "no-store", headers });

function adoptVersion(current, raw, version) {
  current.base = version;
  current.crlf = raw.includes("\r\n");
  current.saved = fromDisk(raw);
}

let paintedLines = [];
let lineEls = [];
let paintedHeadings = [];

function buildLine(text) {
  const el = document.createElement("div");
  el.textContent = text;
  return el;
}

// Runs on every keystroke, so only the lines that changed touch the DOM; a whole rebuild took 64ms at 200K characters.
function paintNote() {
  const text = editor.value;
  const lines = text.split("\n");
  const shortest = Math.min(lines.length, paintedLines.length);
  let head = 0;
  while (head < shortest && lines[head] === paintedLines[head]) head++;
  let tail = 0;
  while (tail < shortest - head && lines[lines.length - 1 - tail] === paintedLines[paintedLines.length - 1 - tail]) tail++;

  const gone = lineEls.slice(head, lineEls.length - tail);
  const fresh = lines.slice(head, lines.length - tail).map(buildLine);
  const after = lineEls[lineEls.length - tail] ?? null;
  const batch = document.createDocumentFragment();
  for (const el of fresh) batch.append(el);
  for (const el of gone) el.remove();
  $("painted").insertBefore(batch, after);
  lineEls = [...lineEls.slice(0, head), ...fresh, ...lineEls.slice(lineEls.length - tail)];
  paintedLines = lines;
  if (doc?.marks.length) {
    const followed = followEdit(doc.marks, head, gone.length, fresh.length, lines);
    if (followed !== doc.marks) setMarks(doc, followed);
    else showMarksInNote(doc);
  }

  const next = parseHeadings(text).map((heading) => ({ ...heading, el: lineEls[heading.line] }));
  const colored = new Set(next.map(({ el }) => el));
  for (const { el } of paintedHeadings) if (!colored.has(el)) el.className = "";
  for (const { el, level } of next) if (el.className !== `h${level}`) el.className = `h${level}`;
  paintedHeadings = next;
}

function setEditorText(text) {
  editor.value = text;
  paintNote();
}

// ---- Undo and redo, kept per note on this phone so they survive Android closing the tab ----

let historyTimer = 0;
const historyKey = (current) => `undo:${current.draftKey.slice("draft:".length)}`;

function showUndoButtons(history) {
  $("undo").hidden = !history?.done.length;
  $("redo").hidden = !history?.undone.length;
}

function keepHistory(current) {
  clearTimeout(historyTimer);
  if (!current?.history) return;
  const { done, undone, text } = current.history;
  try {
    if (done.length || undone.length) localStorage.setItem(historyKey(current), JSON.stringify({ done, undone, hash: hashText(text) }));
    else localStorage.removeItem(historyKey(current));
  } catch {}
}

function loadHistory(current) {
  const history = createHistory(editor.value);
  try {
    const saved = JSON.parse(localStorage.getItem(historyKey(current)));
    // Steps saved against other text would restore into the wrong place.
    if (saved?.hash === hashText(editor.value)) Object.assign(history, { done: saved.done, undone: saved.undone });
  } catch {}
  current.history = history;
  showUndoButtons(history);
}

function trackChange(options) {
  if (!doc?.history) return;
  record(doc.history, editor.value, Date.now(), options);
  showUndoButtons(doc.history);
  clearTimeout(historyTimer);
  const current = doc;
  historyTimer = setTimeout(() => keepHistory(current), HISTORY_DELAY_MS);
}

function applyHistoryStep(step) {
  if (!doc?.history) return;
  const change = step(doc.history);
  if (!change) return;
  editor.setRangeText(change.text, change.start, change.end, "end");
  editor.setSelectionRange(change.caret, change.caret);
  noteChanged();
  showUndoButtons(doc.history);
  keepHistory(doc);
  // The change may be far from where the reader is, and it has to be seen to be trusted.
  const note = $("note");
  const el = lineEls[editor.value.slice(0, change.start).split("\n").length - 1];
  const onScreen = el.offsetTop >= note.scrollTop && el.offsetTop < note.scrollTop + note.clientHeight - el.offsetHeight;
  if (!onScreen) flyTo(el.offsetTop - note.clientHeight / 3);
}

for (const [id, step] of [["undo", undo], ["redo", redo]]) {
  // Keeping focus in the note keeps the phone's keyboard open.
  $(id).addEventListener("mousedown", (event) => event.preventDefault());
  $(id).addEventListener("click", () => applyHistoryStep(step));
}

// The browser's own history is wiped by this page's text updates, and then it stops announcing undo and redo at all.
editor.addEventListener("keydown", (event) => {
  if (!event.ctrlKey && !event.metaKey) return;
  const key = event.key.toLowerCase();
  const isRedo = key === "y" || (key === "z" && event.shiftKey);
  if (key !== "z" && !isRedo) return;
  event.preventDefault();
  applyHistoryStep(isRedo ? redo : undo);
});
editor.addEventListener("beforeinput", (event) => {
  if (event.inputType !== "historyUndo" && event.inputType !== "historyRedo") return;
  event.preventDefault();
  applyHistoryStep(event.inputType === "historyUndo" ? undo : redo);
});

// ---- Marks, kept per note on this phone ----

let markedEls = [];
let markTarget = 0;
const marksKey = (current) => `marks:${current.draftKey.slice("draft:".length)}`;

function showMarksInNote(current) {
  for (const el of markedEls) el.removeAttribute("data-marked");
  markedEls = current.marks.map(({ line }) => lineEls[line]);
  for (const el of markedEls) el.setAttribute("data-marked", "");
}

function setMarks(current, marks) {
  current.marks = marks;
  showMarksInNote(current);
  try { localStorage.setItem(marksKey(current), JSON.stringify(marks)); } catch {}
}

function loadMarks(current) {
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(marksKey(current))) ?? []; } catch {}
  setMarks(current, relocate(saved, paintedLines));
}

// The line being edited, or the top of the screen when the caret is somewhere out of sight.
function lineToMark() {
  const note = $("note");
  const isOnScreen = (el) => el.offsetTop < note.scrollTop + note.clientHeight && el.offsetTop + el.offsetHeight > note.scrollTop;
  const caretLine = editor.value.slice(0, editor.selectionStart).split("\n").length - 1;
  if (isOnScreen(lineEls[caretLine])) return caretLine;
  let low = 0;
  let high = lineEls.length - 1;
  while (low < high) {
    const middle = (low + high) >> 1;
    if (lineEls[middle].offsetTop + lineEls[middle].offsetHeight > note.scrollTop + JUMP_GAP_PX + 1) high = middle;
    else low = middle + 1;
  }
  // A blank line makes a useless mark, with no text to preview or to find again.
  while (low < lineEls.length - 1 && !paintedLines[low].trim()) low++;
  return low;
}

function buildMarkRow({ line, text }) {
  const row = document.createElement("li");
  const go = document.createElement("button");
  go.type = "button";
  go.className = "mark-go";
  go.textContent = text.trim() || "Blank line";
  const where = document.createElement("small");
  where.textContent = `Line ${line + 1}`;
  go.append(where);
  go.addEventListener("click", () => {
    $("toc").close();
    goToLine(line);
  });
  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "mark-remove";
  remove.setAttribute("aria-label", `Remove mark on line ${line + 1}`);
  remove.append(icon("#i-x", ""));
  remove.addEventListener("click", () => {
    setMarks(doc, doc.marks.filter((mark) => mark.line !== line));
    renderMarkRows();
    $("mark-here").focus();
  });
  row.append(go, remove);
  return row;
}

function renderMarkRows() {
  $("marks-list").replaceChildren(...doc.marks.map(buildMarkRow));
  $("marks-section").hidden = doc.marks.length === 0;
}

$("mark-here").addEventListener("click", () => {
  $("toc").close();
  setMarks(doc, relocate([...doc.marks, { line: markTarget, text: paintedLines[markTarget] }], paintedLines));
});

function goToLine(line) {
  // Focusing the note on a phone would pop the keyboard over what the reader came to see.
  if (matchMedia("(pointer: fine)").matches) {
    const offset = paintedLines.slice(0, line).reduce((sum, text) => sum + text.length + 1, 0);
    editor.setSelectionRange(offset, offset);
    editor.focus({ preventScroll: true });
  }
  flyTo(lineEls[line].offsetTop - JUMP_GAP_PX);
}

// ---- Contents ----

function openContents() {
  markTarget = lineToMark();
  renderMarkRows();
  const headings = paintedHeadings;
  const top = $("note").scrollTop + JUMP_GAP_PX + 1;
  const currentAt = headings.findLastIndex(({ el }) => el.offsetTop <= top);
  const shallowest = Math.min(...headings.map(({ level }) => level));
  $("toc-list").replaceChildren(...headings.map((heading, index) => {
    const row = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    button.className = `h${heading.level}`;
    button.style.setProperty("--depth", Math.min(heading.level - shallowest, 3));
    button.textContent = heading.title;
    if (index === currentAt) button.setAttribute("aria-current", "location");
    button.addEventListener("click", () => jumpTo(heading));
    row.append(button);
    return row;
  }));
  $("toc-empty").hidden = headings.length > 0;
  $("toc-list").hidden = headings.length === 0;
  $("toc").showModal();
  const current = $("toc-list").querySelector("[aria-current]");
  current?.focus({ preventScroll: true });
  // Marks sit at the top of the sheet, so scrolling to the current heading would push them out of sight.
  if (doc.marks.length) $("toc").scrollTop = 0;
  else current?.scrollIntoView({ block: "center" });
}

function jumpTo({ line }) {
  $("toc").close();
  goToLine(line);
}

let flight = 0;

// Same short flight at any distance: a far target starts one screen away, so the slide only shows the direction.
function flyTo(target) {
  const note = $("note");
  cancelAnimationFrame(flight);
  const end = Math.max(0, Math.min(target, note.scrollHeight - note.clientHeight));
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    note.scrollTop = end;
    return;
  }
  const start = Math.max(end - note.clientHeight, Math.min(note.scrollTop, end + note.clientHeight));
  const startedAt = performance.now();
  note.scrollTop = start;
  const step = (now) => {
    const t = Math.min(1, (now - startedAt) / FLY_MS);
    note.scrollTop = start + (end - start) * (1 - (1 - t) ** 3);
    if (t < 1) flight = requestAnimationFrame(step);
  };
  flight = requestAnimationFrame(step);
}

for (const type of ["pointerdown", "wheel"]) {
  $("note").addEventListener(type, () => cancelAnimationFrame(flight), { passive: true });
}

$("toc-open").addEventListener("click", openContents);
$("go-top").addEventListener("click", () => {
  $("toc").close();
  flyTo(0);
});
$("go-bottom").addEventListener("click", () => {
  $("toc").close();
  const note = $("note");
  const blankBelowText = parseFloat(getComputedStyle(editor).paddingBlockEnd);
  flyTo(note.scrollHeight - blankBelowText + END_GAP_PX - note.clientHeight);
});

// ---- Reading position, kept per note on this phone ----

let scrollTimer = 0;
const scrollKey = (current) => `scroll:${current.draftKey.slice("draft:".length)}`;

function keepScroll() {
  clearTimeout(scrollTimer);
  if (!doc || doc.base === null) return;
  try { localStorage.setItem(scrollKey(doc), String($("note").scrollTop)); } catch {}
}

function restoreScroll(current) {
  try { $("note").scrollTop = Number(localStorage.getItem(scrollKey(current))) || 0; } catch {}
}

$("note").addEventListener("scroll", () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(keepScroll, SCROLL_DELAY_MS);
}, { passive: true });

// Replaces only the part that changed, so the cursor stays on the same words.
function replaceEditorText(next) {
  const old = editor.value;
  let start = 0;
  while (start < old.length && start < next.length && old[start] === next[start]) start++;
  let oldEnd = old.length;
  let nextEnd = next.length;
  while (oldEnd > start && nextEnd > start && old[oldEnd - 1] === next[nextEnd - 1]) { oldEnd--; nextEnd--; }
  editor.setRangeText(next.slice(start, nextEnd), start, oldEnd, "preserve");
  paintNote();
  trackChange({ separate: true });
}

function setConflict(current, on) {
  current.conflict = on;
  $("conflict").hidden = !on;
  if (on) setStatus("Not saved", "warn");
}

function showEditMessage(text) {
  $("edit-message").textContent = text;
  $("edit-message").hidden = !text;
  $("note").hidden = Boolean(text);
}

async function showFile(root, parts, fromHome) {
  const path = parts.join("/");
  const current = {
    url: `/api/file?${apiQuery(root, path)}`,
    draftKey: `draft:${root}/${path}`,
    base: null,
    saved: "",
    crlf: false,
    saving: false,
    failing: false,
    conflict: false,
    marks: [],
    history: null,
  };
  for (const el of markedEls) el.removeAttribute("data-marked");
  markedEls = [];
  doc = current;
  show("edit", parts.at(-1), [root, ...parts.slice(0, -1)]);
  $("edit-back").href = fromHome ? "/" : pathFor(root, parts.slice(0, -1));
  $("edit-back").setAttribute("aria-label", fromHome ? "Back to home" : "Back to folder");
  $("conflict").hidden = true;
  showEditMessage("");
  setEditorText("");
  $("note").scrollTop = 0;
  $("toc-open").hidden = true;
  showUndoButtons(null);
  editor.disabled = true;
  setStatus("Opening…");

  let res;
  try {
    res = await fetchFile(current);
  } catch {
    if (doc === current) {
      setStatus("Offline", "warn");
      showEditMessage(`Unable to open this file. ${OFFLINE_HELP}`);
    }
    return;
  }
  if (doc !== current) return;
  if (!res.ok) {
    setStatus("Not opened", "warn");
    showEditMessage(await res.text());
    return;
  }
  const raw = decoder.decode(await res.arrayBuffer());
  if (doc !== current) return;
  adoptVersion(current, raw, res.headers.get("ETag"));
  setEditorText(current.saved);
  editor.disabled = false;
  $("toc-open").hidden = false;
  setStatus("Saved");

  const draft = readDraft(current);
  if (draft && draft.text !== current.saved) {
    setEditorText(draft.text);
    if (draft.base === current.base) {
      save();
    } else {
      setConflict(current, true);
    }
  } else {
    clearDraft(current);
  }
  loadHistory(current);
  loadMarks(current);
  restoreScroll(current);
  // A conflict warning has to stay in view, so the sheet doesn't open over it.
  if (paintedHeadings.length >= MIN_HEADINGS_TO_AUTO_OPEN && !current.conflict) {
    openContents();
    // Nobody pressed anything yet, so no button should light up with a focus ring.
    $("toc").focus({ preventScroll: true });
  }
}

async function save() {
  clearTimeout(saveTimer);
  const current = doc;
  if (!current || current.base === null || current.conflict || current.saving || !isDirty(current)) return;
  const sent = editor.value;
  current.saving = true;
  // Failed saves retry every few seconds, and showing each attempt would make the status flicker.
  if (!current.failing) setStatus("Saving…");
  let savedOk = false;
  try {
    const res = await fetch(current.url, {
      method: "PUT",
      headers: { "If-Match": current.base },
      body: toDisk(current, sent),
    });
    if (res.ok) {
      current.base = res.headers.get("ETag");
      current.saved = sent;
      current.failing = false;
      savedOk = true;
      if (doc === current && !isDirty(current)) {
        clearDraft(current);
        setStatus("Saved");
      }
    } else if (res.status === 412) {
      if (doc === current) {
        keepDraft(current);
        setConflict(current, true);
      }
    } else if (doc === current) {
      keepDraft(current);
      current.failing = true;
      setStatus("Not saved, will retry", "warn");
    }
  } catch {
    if (doc === current) {
      keepDraft(current);
      current.failing = true;
      setStatus("Offline, will retry", "warn");
    }
  } finally {
    current.saving = false;
  }
  if (savedOk && doc === current && isDirty(current)) scheduleSave();
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, SAVE_DELAY_MS);
}

async function checkForChanges() {
  const current = doc;
  if (!current || current.base === null || current.saving || current.conflict || document.hidden) return;
  if (isDirty(current)) return save();
  if (composing) return;
  const asked = current.base;
  try {
    const res = await fetchFile(current, { "If-None-Match": asked });
    if (res.status === 304) {
      if (doc === current && !isDirty(current)) setStatus("Saved");
      return;
    }
    if (!res.ok) {
      if (doc === current) setStatus(res.status === 404 ? "File not found" : "Not reachable", "warn");
      return;
    }
    const raw = decoder.decode(await res.arrayBuffer());
    // The phone moved on while this was in flight; the next round decides.
    if (doc !== current || current.base !== asked || current.saving || isDirty(current) || composing) return;
    adoptVersion(current, raw, res.headers.get("ETag"));
    replaceEditorText(current.saved);
    setStatus("Updated from PC");
  } catch {
    if (doc === current) setStatus("Offline", "warn");
  }
}

editor.addEventListener("input", () => {
  noteChanged();
  trackChange();
});

function noteChanged() {
  paintNote();
  if (!doc) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(flushDraft, DRAFT_DELAY_MS);
  if (doc.conflict) return;
  if (!doc.failing) setStatus("Saving…");
  scheduleSave();
}

editor.addEventListener("compositionstart", () => { composing = true; });
editor.addEventListener("compositionend", () => { composing = false; });

$("keep-mine").addEventListener("click", async () => {
  const current = doc;
  try {
    const res = await fetchFile(current);
    if (!res.ok) throw new Error();
    current.base = res.headers.get("ETag");
    setConflict(current, false);
    await save();
  } catch {
    setStatus("Offline, try again", "warn");
  }
});

$("use-pc").addEventListener("click", async () => {
  const current = doc;
  try {
    const res = await fetchFile(current);
    if (!res.ok) throw new Error();
    adoptVersion(current, decoder.decode(await res.arrayBuffer()), res.headers.get("ETag"));
    setEditorText(current.saved);
    trackChange({ separate: true });
    clearDraft(current);
    setConflict(current, false);
    setStatus("Saved");
  } catch {
    setStatus("Offline, try again", "warn");
  }
});

// ---- Routing ----

async function route(fromHome = false) {
  $("toc").close();
  cancelAnimationFrame(flight);
  keepScroll();
  keepHistory(doc);
  flushDraft();
  await save();
  doc = null;
  const [root, ...rest] = parsePath(location.pathname);
  if (!root) return showRoots();
  if (/\.md$/i.test(rest.at(-1) ?? "")) return showFile(root, rest, fromHome);
  return showFolder(root, rest);
}

// Links saved before URLs became real paths look like /#/folder/note.md.
if (location.hash.startsWith("#/")) history.replaceState(null, "", location.hash.slice(1));

let currentPath = location.pathname;

function changeRoute(browserAnimatesIt) {
  const from = parsePath(currentPath).length;
  const to = parsePath(location.pathname).length;
  currentPath = location.pathname;
  // A pinned file opened from home goes back to home, not up through its folders.
  const fromHome = from === 0;
  if (!document.startViewTransition || browserAnimatesIt || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    route(fromHome);
    return;
  }
  // The slide waits for the next screen's content, but never long enough to feel stuck on a slow connection.
  const update = () => Promise.race([route(fromHome), new Promise((done) => setTimeout(done, CONTENT_WAIT_MS))]);
  document.startViewTransition({ update, types: [to < from ? "back" : "forward"] });
}

function navigate(path) {
  if (path === location.pathname) return;
  history.pushState(null, "", path);
  changeRoute(false);
}

document.addEventListener("click", (event) => {
  const link = event.target.closest("a[href]");
  if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  event.preventDefault();
  navigate(link.getAttribute("href"));
});
// Android's back gesture draws its own animation, and a second one on top would look broken.
window.addEventListener("popstate", (event) => changeRoute(event.hasUAVisualTransition));
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    keepScroll();
    keepHistory(doc);
    flushDraft();
    save();
  } else {
    checkForChanges();
  }
});
window.addEventListener("online", checkForChanges);
setInterval(checkForChanges, POLL_MS);
route();
</script>
</body>
